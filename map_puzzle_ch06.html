<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>道しるべ｜ZERAPHIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#33230f;--ink-soft:#5e4528;--muted:#86704e;--gold:#b8892f;--gold-hi:#ecd08a;--gold-deep:#7a5420}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;overflow:hidden!important;overscroll-behavior:none;touch-action:none}
body{color:var(--ink);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;-webkit-tap-highlight-color:transparent;
  background:#f4ecdc url("images/bg_mappuzzle.webp") center/cover no-repeat}
/* 背景素材の上に、文字が読みやすいよう淡い光をのせる */
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 42%,rgba(255,252,243,.55),rgba(255,250,238,.2) 60%,transparent 85%),
             linear-gradient(180deg,rgba(255,251,240,.35),transparent 30%,transparent 75%,rgba(255,248,232,.35))}
/* 外枠 */
body:before{content:"";position:fixed;inset:7px;z-index:2;pointer-events:none;border:1.5px solid rgba(166,122,50,.75);
  box-shadow:inset 0 0 0 3px rgba(255,251,240,.7),inset 0 0 0 4px rgba(166,122,50,.35)}
.corner{position:fixed;width:50px;height:50px;z-index:0;pointer-events:none;color:#b08640;opacity:.9}
.corner svg{width:100%;height:100%;display:block}
.corner.tl{top:3px;left:3px}.corner.tr{top:3px;right:3px;transform:scaleX(-1)}
.corner.bl{bottom:3px;left:3px;transform:scaleY(-1)}.corner.br{bottom:3px;right:3px;transform:scale(-1,-1)}
.edge-orn{position:fixed;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;color:#b08640;width:64px;height:16px}
.edge-orn.top{top:1px}.edge-orn.bottom{bottom:1px;transform:translateX(-50%) scaleY(-1)}

main{position:relative;z-index:1;width:100%;max-width:560px;height:100dvh;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}

/* ヘッダー */
.chapter{margin:0;display:flex;align-items:center;gap:10px;font-size:min(11px,2.8vw);letter-spacing:.22em;color:#6f5737;white-space:nowrap}
.chapter:before,.chapter:after{content:"";width:min(46px,9vw);height:1px;background:linear-gradient(90deg,transparent,rgba(162,119,51,.8))}
.chapter:after{background:linear-gradient(270deg,transparent,rgba(162,119,51,.8))}
.chapter .en{letter-spacing:.3em}
h1{margin:clamp(6px,1.4dvh,14px) 0 0;font-size:clamp(22px,min(5dvh,9vw),40px);font-weight:700;letter-spacing:.12em;color:#2c1d0c;line-height:1.2;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(255,248,230,.9)}
.divider{display:flex;align-items:center;gap:7px;margin-top:clamp(4px,.8dvh,8px)}
.divider span{width:min(96px,20vw);height:1px;background:linear-gradient(90deg,transparent,rgba(162,119,51,.8))}
.divider span:last-child{background:linear-gradient(270deg,transparent,rgba(162,119,51,.8))}
.divider b{width:4px;height:4px;transform:rotate(45deg);background:var(--gold);opacity:.75}
.divider svg{width:14px;height:14px;color:var(--gold)}
.guide{margin:clamp(6px,1.4dvh,14px) 0 0;min-height:4.8em;font-size:clamp(10.5px,min(2dvh,3.25vw),16px);font-weight:500;line-height:1.6;
  letter-spacing:.05em;color:#3e2b14;text-align:center;white-space:nowrap;text-shadow:0 0 8px rgba(255,252,243,.95),0 0 2px #fffaf0;transition:opacity .35s}

/* 盤面 */
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:clamp(6px,1.2dvh,12px) 0}
.paper{position:relative;width:100%;max-height:100%;aspect-ratio:388/308}
svg#board{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.frame-shadow{filter:url(#fShadow)}
.edge{stroke:#7d5d36;stroke-width:1.7;stroke-linecap:round;opacity:.7}
.edge.faint{stroke-dasharray:5 4.5}
.trail{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trail.glow{stroke:#ffd777;stroke-width:10;opacity:.5;filter:url(#fGlowBig)}
.trail.core{stroke:#e2a835;stroke-width:4}
.trail.hi{stroke:#fff8dc;stroke-width:1.3;opacity:.9}
svg.linked .trail.glow{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.9;stroke-width:14}}
.trail-head .halo{fill:url(#gHalo);opacity:.85;animation:headpulse 1.3s ease-in-out infinite alternate}
.trail-head .spark{fill:#fffbe8;filter:url(#fGlow)}
@keyframes headpulse{from{opacity:.45}to{opacity:1}}
.node .face{fill:url(#gFace);stroke:url(#gRing);stroke-width:2.4}
.node .inner{fill:none;stroke:rgba(176,134,64,.55);stroke-width:.8}
.node .core{fill:#5e4224}
.node .ring2{fill:none;stroke:url(#gRing);stroke-width:1.8}
.node .spike{fill:url(#gRing);stroke:#7a5420;stroke-width:.4}
.node.lit .face{fill:url(#gLitFace);filter:url(#fGlow)}
.node.lit .core{fill:#fffbea;stroke:#b8862c;stroke-width:.8}
.node.lit .inner{stroke:rgba(255,248,220,.9)}
.node .can-ring{fill:none;stroke:#c99632;stroke-width:1.6;stroke-dasharray:3 3;opacity:0}
.node.can .can-ring{opacity:.95;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-60}}
.node .hint-ring{fill:none;stroke:#ffcf4d;stroke-width:4;opacity:0;filter:url(#fGlow)}
.node.hint .hint-ring{animation:hint 1s ease-in-out 3}
@keyframes hint{50%{opacity:1}}
.node.start .sun{fill:url(#gHalo);opacity:.9;animation:headpulse 1.8s ease-in-out infinite alternate}
/* 始まりの印：光が外へあふれ出す波紋 */
.ripple{fill:none;stroke:#e8b54a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;opacity:0}
svg.fresh .node.start .ripple{animation:rippleOut 2.2s ease-out infinite}
svg.fresh .node.start .ripple.r2{animation-delay:1.1s}
@keyframes rippleOut{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.5);opacity:0}}
/* 終わりの印：光を吸い寄せる波紋（外から内へ）。中の星は空っぽで、光を待っている */
.node.goal:not(.lit) .ripple{stroke:#c9962f;animation:rippleIn 2.4s ease-in infinite}
.node.goal:not(.lit) .ripple.r2{animation-delay:1.2s}
@keyframes rippleIn{0%{transform:scale(2.6);opacity:0}35%{opacity:.85}100%{transform:scale(1);opacity:0}}
.node.goal:not(.lit) .core{fill:none;stroke:#a87428;stroke-width:1.3;stroke-dasharray:2.2 1.6}
.node.goal:not(.lit) .face{fill:url(#gGoalFace)}
/* 開始時に、始まり→終わりへ流れる光 */
.comet-tail{fill:none;stroke:#ffcf5a;stroke-width:6;stroke-linecap:round;opacity:.95;filter:url(#fGlowBig)}
.comet-core{fill:none;stroke:#fff6d6;stroke-width:1.6;stroke-linecap:round;opacity:.95}
.comet{fill:#fffbe8;filter:url(#fGlow)}
.node.start .ray{stroke:#d9a43a;stroke-width:1;stroke-linecap:round;opacity:.75}
.decor .star{fill:#c9a35a;opacity:.45}
.decor .compass{fill:none;stroke:rgba(150,112,58,.28);stroke-width:.7}
.decor .compass-fill{fill:rgba(150,112,58,.16)}
svg.fade .edge,svg.fade .node,svg.fade .trail,svg.fade .trail-head{transition:opacity 1.6s ease;opacity:.07}
svg.fade.clean .edge,svg.fade.clean .node,svg.fade.clean .trail,svg.fade.clean .trail-head{opacity:0}
.reveal{animation:revealIn 2.2s ease forwards;opacity:0}
@keyframes revealIn{to{opacity:1}}

/* ステータス */
.statusbar{width:100%;display:flex;align-items:center;gap:8px;margin-top:clamp(4px,1dvh,10px)}
.statusbar:before,.statusbar:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(162,119,51,.75))}
.statusbar:after{background:linear-gradient(270deg,transparent,rgba(162,119,51,.75))}
.statusbar i{font-style:normal;color:var(--gold);font-size:12px}
.status{margin:0;padding:clamp(5px,1.1dvh,11px) clamp(16px,5vw,30px);font-size:clamp(12px,min(2dvh,3.6vw),16px);letter-spacing:.1em;color:#3e2b14;white-space:nowrap;border-radius:4px;
  background:linear-gradient(180deg,rgba(255,253,246,.96),rgba(244,233,208,.96));border:1px solid #a27b42;
  box-shadow:inset 0 0 0 3px rgba(255,252,243,.9),inset 0 0 0 4px rgba(162,119,51,.35),0 3px 8px rgba(80,50,15,.12)}
.status .sep{display:inline-block;width:1.2em}
.status b{color:#b07a1e;font-weight:700;font-size:1.5em;margin:0 .25em 0 .4em;letter-spacing:0;vertical-align:-.08em}

/* ボタン */
button{appearance:none;font:inherit;color:#4a3216;cursor:pointer;border-radius:4px;
  background:linear-gradient(180deg,#fffdf6,#efe2c6);border:1px solid #a27b42;
  box-shadow:inset 0 0 0 2px rgba(255,252,243,.95),inset 0 0 0 3px rgba(162,119,51,.35),0 3px 7px rgba(80,50,15,.16)}
button:active{filter:brightness(.94);transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default}
.controls{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,10px);margin-top:clamp(8px,1.6dvh,16px)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:clamp(44px,7dvh,62px);padding:0 6px;font-size:clamp(11px,3.4vw,16px);font-weight:600;letter-spacing:.06em;white-space:nowrap}
.btn svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.gold{color:#3d2810;background:linear-gradient(180deg,#f8e2a6,#d9b061 55%,#c39540);border-color:#8c6420;
  box-shadow:inset 0 0 0 2px rgba(255,244,210,.75),inset 0 0 0 3px rgba(140,100,32,.45),0 3px 8px rgba(80,50,15,.22)}
@media(max-width:440px){.btn{flex-direction:column;gap:2px;padding:4px 3px;letter-spacing:.03em}.btn svg{width:17px;height:17px}}
.note{margin:clamp(5px,1dvh,10px) 0 0;font-size:min(10px,2.6vw);line-height:1.6;color:var(--ink-soft);text-align:center;text-shadow:0 0 6px rgba(255,252,243,.95)}
@media(max-height:700px){.note{display:none}.guide{min-height:4.6em}}
@media(max-height:600px){.divider{display:none}.guide{font-size:10.5px;line-height:1.45}}
</style>
</head>

<svg class="edge-orn top" viewBox="0 0 64 16" aria-hidden="true"><path d="M32 1l4 7-4 7-4-7z" fill="currentColor"/><path d="M2 8h20M42 8h20" stroke="currentColor" stroke-width="1"/><circle cx="24" cy="8" r="1.5" fill="currentColor"/><circle cx="40" cy="8" r="1.5" fill="currentColor"/></svg>

<main>
  <p class="chapter"><span class="en">ZERAPHIA</span><span>/</span><span>第六章・道しるべ</span></p>
  <h1 id="title">道しるべ</h1>
  <div class="divider" aria-hidden="true"><span></span><b></b><svg viewBox="0 0 20 20"><path d="M10 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z" fill="currentColor"/></svg><b></b><span></span></div>
  <p class="guide" id="guide"></p>
  <div class="stage"><div class="paper"><svg id="board" viewBox="-14 -14 388 308" role="group" aria-label="図形が描かれた古い紙"></svg></div></div>
  <div class="statusbar"><i>✦</i><p class="status" id="status"></p><i>✦</i></div>
  <div class="controls">
    <button type="button" class="btn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>ひとつ戻る</span></button>
    <button type="button" class="btn" id="resetBtn"><svg viewBox="0 0 24 24"><path d="M19.5 12A7.5 7.5 0 1 1 17 6.4"/><path d="M19.5 3.5v4.5H15"/></svg><span>最初から</span></button>
    <button type="button" class="btn gold" id="hintBtn"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span id="hintLabel">ヒント（残り3）</span></button>
  </div>
  <p class="note">指でなぞるか、隣の印をタップして進む。<br>通った印をタップすると、そこまで戻る。</p>

<script>
/*LOGIC_START*/
// 盤面: nodes=[x,y](viewBox 360x280), edges=[a,b], start/goal=ノード番号
// ルール: start から、すべての印をちょうど一度ずつ通り、最後に goal へ着く
const LEVELS = [
  { name:'一枚目', revealImage:'images/ch06_paper1_reveal.webp', intro:'塔の壁から見つかった紙。<br>光のあふれる印から、すべての印を一度ずつ通って、<br>光を待つ印まで、線をつなごう。',
    nodes:[[47, 30], [138, 27], [217, 29], [315, 27], [53, 100], [127, 96], [228, 107], [306, 101], [39, 175], [127, 165], [222, 163], [322, 174], [38, 237], [127, 234], [224, 243], [308, 233]],
    edges:[[0, 1], [0, 4], [1, 4], [1, 2], [1, 5], [1, 6], [2, 3], [2, 6], [2, 7], [3, 7], [4, 5], [4, 8], [5, 8], [6, 9], [6, 7], [6, 10], [7, 10], [7, 11], [8, 9], [8, 12], [9, 12], [9, 10], [9, 13], [9, 14], [10, 14], [11, 15], [12, 13], [13, 14], [14, 15]],
    start:4, goal:11 },
  { name:'二枚目', revealImage:'images/ch06_paper2_reveal.webp', intro:'トイフェルが持っていた紙。<br>光のあふれる印から、すべての印を一度ずつ通って、<br>光を待つ印まで、線をつなごう。',
    nodes:[[47, 35], [117, 31], [174, 32], [253, 29], [330, 28], [47, 95], [106, 109], [188, 107], [252, 108], [331, 108], [40, 171], [107, 167], [178, 164], [260, 171], [329, 177], [39, 244], [109, 232], [174, 246], [255, 235], [323, 234]],
    edges:[[0, 1], [0, 5], [1, 5], [1, 2], [1, 6], [1, 7], [2, 3], [2, 7], [2, 8], [3, 4], [3, 8], [3, 9], [4, 9], [5, 6], [5, 10], [6, 10], [6, 11], [7, 8], [7, 12], [7, 13], [8, 9], [8, 13], [9, 13], [10, 11], [10, 15], [11, 15], [11, 12], [11, 16], [12, 16], [12, 13], [12, 18], [13, 14], [13, 18], [13, 19], [15, 16], [16, 17], [17, 18], [18, 19]],
    start:5, goal:14 }
];
function adjOf(L){ const a=L.nodes.map(()=>[]); L.edges.forEach(([u,v])=>{a[u].push(v);a[v].push(u);}); return a; }
// 一筆の解をすべて数える(最大limit件)
function solutions(L,limit){
  const n=L.nodes.length, adj=adjOf(L), out=[], vis=new Array(n).fill(false);
  const path=[L.start]; vis[L.start]=true;
  (function dfs(u){
    if(out.length>=limit) return;
    if(path.length===n){ if(u===L.goal) out.push(path.slice()); return; }
    if(u===L.goal) return;
    for(const v of adj[u]) if(!vis[v]){ vis[v]=true; path.push(v); dfs(v); path.pop(); vis[v]=false; }
  })(L.start);
  return out;
}
/*LOGIC_END*/

(function(){
  'use strict';
  window.sendMapEvent=function(type){
    try{
      if(type==='zeraphia-map-cleared'&&typeof window.zeraphiaMapClear==='function'){window.zeraphiaMapClear();return;}
      if(type==='zeraphia-map-exit'&&typeof window.zeraphiaMapExit==='function'){window.zeraphiaMapExit();return;}
      parent.postMessage({type},location.origin);
    }catch(e){console.error(e);}
  };
  const NS='http://www.w3.org/2000/svg', R=13;
  const svg=document.getElementById('board'), guide=document.getElementById('guide'), statusEl=document.getElementById('status');
  const hintLabel=document.getElementById('hintLabel');
  const HINT_MAX=3;
  let li=0, L=null, adj=null, sol=null, path=[], solved=false, hintsLeft=HINT_MAX, dragging=false;
  const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
  const star4=(s,k=.26)=>`M0 ${-s}L${s*k} ${-s*k}L${s} 0L${s*k} ${s*k}L0 ${s}L${-s*k} ${s*k}L${-s} 0L${-s*k} ${-s*k}Z`;

  function load(i){
    li=i; L=LEVELS[i]; adj=adjOf(L); sol=solutions(L,2)[0]; path=[L.start]; solved=false;
    svg.classList.remove('linked','clean');
    document.getElementById('title').textContent='道しるべ　'+L.name;
    guide.innerHTML=L.intro;
    draw();
    setTimeout(()=>showFlow(i),500);
  }

  // 開始時に一度だけ、始まりの印から終わりの印へ光が流れていく（道筋は示さず、両端だけを伝える）
  function showFlow(levelIndex){
    if(levelIndex!==li||path.length!==1||solved) return;
    const [x0,y0]=L.nodes[L.start], [x1,y1]=L.nodes[L.goal];
    const mx=(x0+x1)/2, my=Math.min(y0,y1)-70, g=el('g',{class:'flow'},svg);
    const tail=el('path',{class:'comet-tail'},g), core=el('path',{class:'comet-core'},g), head=el('circle',{class:'comet',r:6},g);
    const P=t=>[(1-t)*(1-t)*x0+2*(1-t)*t*mx+t*t*x1,(1-t)*(1-t)*y0+2*(1-t)*t*my+t*t*y1];
    const T=1500, t0=performance.now();
    (function frame(now){
      if(!g.isConnected) return;                       // 操作して再描画されたら中止
      const k=Math.min(1,(now-t0)/T), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const pts=[]; for(let j=Math.max(0,e-.22);j<=e;j+=.02) pts.push(P(j).map(v=>v.toFixed(1)).join(' '));
      pts.push(P(e).map(v=>v.toFixed(1)).join(' '));
      tail.setAttribute('d','M'+pts.join(' L')); core.setAttribute('d','M'+pts.join(' L'));
      const [hx,hy]=P(e); head.setAttribute('cx',hx); head.setAttribute('cy',hy);
      if(k<1) requestAnimationFrame(frame);
      else { g.style.transition='opacity .6s'; g.style.opacity='0'; setTimeout(()=>g.remove(),650); }
    })(t0);
  }

  // ---- 描画用の素材（グラデーション・光・紙の質感） ----
  function defs(){
    const d=el('defs',{},svg);
    const lin=(id,stops,x2,y2)=>{const g=el('linearGradient',{id,x1:'0',y1:'0',x2:x2||'1',y2:y2||'1'},d);stops.forEach(([o,c,op])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':op==null?1:op},g));};
    const rad=(id,stops,cx,cy,r)=>{const g=el('radialGradient',{id,cx:cx||'.5',cy:cy||'.5',r:r||'.5'},d);stops.forEach(([o,c,op])=>el('stop',{offset:o,'stop-color':c,'stop-opacity':op==null?1:op},g));};
    lin('gRing',[[0,'#f8e3a2'],[.35,'#b8862c'],[.62,'#f0d088'],[1,'#8a5f1f']]);
    lin('gFrame',[[0,'#f6dea0'],[.25,'#b07c2a'],[.5,'#f3d68f'],[.75,'#a87428'],[1,'#7a531b']]);
    lin('gPaper',[[0,'#f8f0dc'],[.55,'#ecdfc1'],[1,'#e2cfa6']],'0','1');
    rad('gFace',[[0,'#fffefa'],[.65,'#f5ebd5'],[1,'#e2cfa6']],'.42','.38','.65');
    rad('gLitFace',[[0,'#fffdf0'],[.45,'#ffe9a6'],[1,'#dca23a']],'.42','.38','.65');
    rad('gGoalFace',[[0,'#fbf3df'],[.6,'#efe0bd'],[1,'#d8bf8c']],'.42','.38','.65');
    rad('gHalo',[[0,'#fff3c4',.95],[.45,'#ffd46a',.5],[1,'#ffcf5a',0]]);
    rad('gVignette',[[.6,'#000',0],[1,'#6b4a1e',.22]]);
    const glow=(id,sd)=>{const f=el('filter',{id,x:'-80%',y:'-80%',width:'260%',height:'260%'},d);el('feGaussianBlur',{in:'SourceGraphic',stdDeviation:sd,result:'b'},f);const m=el('feMerge',{},f);el('feMergeNode',{in:'b'},m);el('feMergeNode',{in:'SourceGraphic'},m);};
    glow('fGlow','2.6'); 
    const fb=el('filter',{id:'fGlowBig',x:'-20%',y:'-20%',width:'140%',height:'140%'},d); el('feGaussianBlur',{stdDeviation:'3.5'},fb);
    const fs=el('filter',{id:'fShadow',x:'-10%',y:'-10%',width:'120%',height:'125%'},d); el('feDropShadow',{dx:'0',dy:'4',stdDeviation:'5','flood-color':'#4a3010','flood-opacity':'.25'},fs);
    const fn=el('filter',{id:'fNoise',x:'0',y:'0',width:'100%',height:'100%'},d);
    el('feTurbulence',{type:'fractalNoise',baseFrequency:'.85',numOctaves:'2',stitchTiles:'stitch'},fn);
    el('feColorMatrix',{values:'0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .14  0 0 0 .11 0'},fn);
  }

  // ---- 額縁と紙（盤面の外側に描くので、印の座標は変わらない） ----
  function paper(){
    const g=el('g',{class:'decor'},svg), X=-14, Y=-14, W=388, H=308;
    el('rect',{x:X+1,y:Y+1,width:W-2,height:H-2,rx:6,fill:'url(#gFrame)',stroke:'#5e3f16','stroke-width':.8,class:'frame-shadow'},g);
    el('rect',{x:X+5,y:Y+5,width:W-10,height:H-10,rx:4,fill:'url(#gPaper)',stroke:'#7a531b','stroke-width':.7},g);
    el('rect',{x:X+5,y:Y+5,width:W-10,height:H-10,rx:4,filter:'url(#fNoise)',opacity:'.9'},g);
    el('rect',{x:X+5,y:Y+5,width:W-10,height:H-10,rx:4,fill:'url(#gVignette)'},g);
    el('rect',{x:X+10,y:Y+10,width:W-20,height:H-20,rx:2,fill:'none',stroke:'rgba(160,118,52,.55)','stroke-width':.8},g);
    // 四隅の飾り
    [[X+10,Y+10,1,1],[X+W-10,Y+10,-1,1],[X+10,Y+H-10,1,-1],[X+W-10,Y+H-10,-1,-1]].forEach(([x,y,sx,sy])=>{
      const c=el('g',{transform:`translate(${x} ${y}) scale(${sx} ${sy})`},g);
      el('path',{d:'M0 22C0 9 9 0 22 0M4 30C4 14 14 4 30 4',fill:'none',stroke:'#a87a32','stroke-width':.9,opacity:.8},c);
      el('path',{d:star4(4),transform:'translate(7 7)',fill:'#b8862c'},c);
    });
    // 上下中央の飾り
    [[180,Y+5],[180,Y+H-5]].forEach(([x,y])=>el('path',{d:star4(6,.3),transform:`translate(${x} ${y})`,fill:'#c99a45',stroke:'#7a531b','stroke-width':.5},g));
    // 方位盤（淡く）
    const cp=el('g',{transform:'translate(180 140)'},g);
    el('circle',{class:'compass',r:62},cp); el('circle',{class:'compass',r:56,'stroke-dasharray':'1 4'},cp); el('circle',{class:'compass',r:24},cp);
    el('path',{class:'compass-fill',d:star4(70,.12)},cp); el('path',{class:'compass-fill',d:star4(40,.14),transform:'rotate(45)'},cp);
    // 星屑（毎回同じ位置）
    let s=7; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
    for(let k=0;k<22;k++){ el('path',{class:'star',d:star4(1.6+rnd()*2.4,.22),transform:`translate(${(rnd()*350+5).toFixed(1)} ${(rnd()*270+5).toFixed(1)})`},g); }
  }

  function draw(hintNode){
    svg.innerHTML=''; svg.classList.remove('fade'); svg.classList.toggle('fresh',path.length===1&&!solved);
    defs(); paper();
    // 線
    L.edges.forEach(([a,b])=>{const [x1,y1]=L.nodes[a],[x2,y2]=L.nodes[b]; el('line',{class:'edge faint',x1,y1,x2,y2},svg);});
    // 光の軌跡
    if(path.length>1){
      const pts=path.map(i=>L.nodes[i].join(',')).join(' ');
      ['glow','core','hi'].forEach(k=>el('polyline',{class:'trail '+k,points:pts},svg));
    }
    const last=path[path.length-1];
    const can=new Set(solved?[]:adj[last].filter(v=>!path.includes(v)&&(v!==L.goal||path.length===L.nodes.length-1)));
    if(!solved && path.length>1){
      const [hx,hy]=L.nodes[last], h=el('g',{class:'trail-head',transform:`translate(${hx} ${hy})`},svg);
      el('circle',{class:'halo',r:R+12},h);
    }
    L.nodes.forEach(([x,y],i)=>{
      const cls=['node']; if(path.includes(i))cls.push('lit'); if(can.has(i))cls.push('can'); if(i===L.start)cls.push('start'); if(i===L.goal)cls.push('goal'); if(i===hintNode)cls.push('hint');
      const g=el('g',{class:cls.join(' '),'data-i':i,transform:`translate(${x} ${y})`},svg);
      if(i===L.start){
        el('circle',{class:'sun',r:R+13},g);
        for(let k=0;k<16;k++){ const a=k*Math.PI/8, r1=R+4, r2=R+(k%2?8:11); el('line',{class:'ray',x1:(Math.cos(a)*r1).toFixed(2),y1:(Math.sin(a)*r1).toFixed(2),x2:(Math.cos(a)*r2).toFixed(2),y2:(Math.sin(a)*r2).toFixed(2)},g); }
        [0,90,180,270].forEach(a=>el('path',{class:'spike',d:`M0 ${-(R+13)}L2.6 ${-(R+3)}L0 ${-(R+1)}L-2.6 ${-(R+3)}Z`,transform:`rotate(${a})`},g));
      }
      if(i===L.goal){
        [0,90,180,270].forEach(a=>el('path',{class:'spike',d:`M0 ${-(R+15)}L3.2 ${-(R+5)}L0 ${-(R+3)}L-3.2 ${-(R+5)}Z`,transform:`rotate(${a})`},g));
        [45,135,225,315].forEach(a=>el('path',{class:'spike',d:`M0 ${-(R+10)}L1.8 ${-(R+5)}L0 ${-(R+4)}L-1.8 ${-(R+5)}Z`,transform:`rotate(${a})`},g));
        el('circle',{class:'ring2',r:R+5},g);
      }
      if(i===L.start||i===L.goal){ el('circle',{class:'ripple',r:R+2},g); el('circle',{class:'ripple r2',r:R+2},g); }
      el('circle',{class:'hint-ring',r:R+5},g);
      el('circle',{class:'can-ring',r:R+4.5},g);
      el('circle',{class:'face',r:R},g);
      el('circle',{class:'inner',r:R-3.2},g);
      el('path',{class:'core',d:star4(i===L.start||i===L.goal?7.5:6.5,.3)},g);
    });
    updateStatus();
  }

  // 解いたあとに浮かび上がる紋様の画像（後で用意する。画像がなければ何も出さない）
  function drawReveal(){
    if(!L.revealImage) return;
    const img=el('image',{class:'reveal',href:L.revealImage,x:0,y:0,width:360,height:280,preserveAspectRatio:'xMidYMid meet'},svg);
    img.addEventListener('error',()=>img.remove());
    img.addEventListener('load',()=>svg.classList.add('clean'));
  }

  function updateStatus(){
    statusEl.innerHTML=`${L.name}（${li+1} / ${LEVELS.length}）<span class="sep"></span>灯った印<b>${path.length}</b>/ ${L.nodes.length}`;
    const hb=document.getElementById('hintBtn'); hintLabel.textContent=`ヒント（残り${hintsLeft}）`; hb.disabled=solved||hintsLeft<=0;
    document.getElementById('backBtn').disabled=solved||path.length<=1;
    document.getElementById('resetBtn').disabled=solved;
  }

  function tryVisit(i){
    if(solved||i==null) return false;
    const last=path[path.length-1];
    if(i===last) return false;
    const idx=path.indexOf(i);
    if(idx>=0){ path=path.slice(0,idx+1); draw(); return true; }      // 通った印 → そこまで戻る
    if(!adj[last].includes(i)) return false;                          // 線でつながっていない
    if(i===L.goal && path.length<L.nodes.length-1){ guide.innerHTML='光を待つ印は、最後にたどり着く場所。<br>まだ灯っていない印がある。'; return false; }
    path.push(i); afterMove(); return true;
  }

  function afterMove(){
    const last=path[path.length-1];
    if(path.length===L.nodes.length && last===L.goal){ win(); return; }
    const next=adj[last].filter(v=>!path.includes(v)&&(v!==L.goal||path.length===L.nodes.length-1));
    guide.innerHTML = next.length ? L.intro : '……光が、途切れてしまった。<br>通った印をタップすると、そこまで戻れる。';
    draw();
  }

  function win(){
    solved=true; dragging=false; draw(); svg.classList.add('linked');
    guide.innerHTML='……つながった。';
    const final=li+1>=LEVELS.length;
    setTimeout(()=>{
      svg.classList.add('fade'); drawReveal();
      guide.innerHTML='光の線がほどけ、<br>紙の上に、何かが浮かび上がる……';
    },1300);
    setTimeout(()=>{ if(!final) load(li+1); else { statusEl.innerHTML='二枚の紙が、すべてつながった'; window.sendMapEvent('zeraphia-map-cleared'); } }, final?5600:4600);
  }

  function nodeAt(clientX,clientY,radius){
    const p=svg.createSVGPoint(); p.x=clientX; p.y=clientY;
    const m=svg.getScreenCTM(); if(!m) return null;
    const q=p.matrixTransform(m.inverse());
    let best=null,bd=1e9;
    L.nodes.forEach(([x,y],i)=>{const d=Math.hypot(x-q.x,y-q.y); if(d<bd){bd=d;best=i;}});
    return bd<=radius?best:null;
  }
  svg.addEventListener('pointerdown',e=>{
    if(solved) return; e.preventDefault();
    const i=nodeAt(e.clientX,e.clientY,R+10);
    if(i===path[path.length-1]){ dragging=true; svg.setPointerCapture(e.pointerId); return; }
    if(tryVisit(i)){ dragging=true; svg.setPointerCapture(e.pointerId); }
  });
  svg.addEventListener('pointermove',e=>{
    if(!dragging||solved) return;
    const i=nodeAt(e.clientX,e.clientY,R+4); if(i==null) return;
    const last=path[path.length-1];
    if(path.length>1 && i===path[path.length-2]){ path.pop(); draw(); return; } // なぞり戻し
    if(i!==last && !path.includes(i)) tryVisit(i);
  });
  const end=()=>{dragging=false;};
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);

  function showHint(){
    if(solved||hintsLeft<=0) return;
    // いまの道が正解の途中なら次の印、違っていれば戻る場所を示す
    let k=0; while(k<path.length&&path[k]===sol[k]) k++;
    hintsLeft--;
    if(k===path.length){ draw(sol[k]); guide.innerHTML='ヒント：光った印へ。'; }
    else { draw(sol[k-1]); guide.innerHTML='ヒント：光った印まで戻ってみよう。'; }
  }

  document.getElementById('backBtn').addEventListener('click',()=>{ if(!solved&&path.length>1){ path.pop(); guide.innerHTML=L.intro; draw(); } });
  document.getElementById('resetBtn').addEventListener('click',()=>{ if(!solved){ path=[L.start]; guide.innerHTML=L.intro; draw(); } });
  document.getElementById('hintBtn').addEventListener('click',showHint);
  const q=new URLSearchParams(location.search).get('level');
  load(q?Math.max(0,Math.min(LEVELS.length-1,Number(q)-1)):0);
})();
</script>
