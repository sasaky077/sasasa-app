<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>道しるべ｜ZERAPHIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d2c1c;--gold:#bc8d36;--glow:#f9d88a}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;overflow:hidden!important;overscroll-behavior:none;touch-action:none}
body{color:var(--ink);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% 47%,#fffdf6 0%,#f3ead8 50%,#d5c4a4 100%)}
body:before{content:"";position:fixed;inset:7px;pointer-events:none;border:1px solid rgba(132,94,42,.36);box-shadow:inset 0 0 0 4px rgba(255,255,255,.42),inset 0 0 0 5px rgba(157,119,62,.20);z-index:0}
main{position:relative;z-index:1;width:100%;max-width:600px;height:100dvh;margin:0 auto;padding:calc(13px + env(safe-area-inset-top)) 11px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.chapter{margin:0;font-size:10px;letter-spacing:.24em;color:#866b43;text-shadow:0 1px #fff}
#exitBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));left:17px;min-height:32px;padding:5px 11px;z-index:3;font-size:11px}
h1{margin:8px 0 0;font-size:clamp(19px,3.4dvh,25px);font-weight:600;letter-spacing:.17em;color:#4d3520;text-shadow:0 1px 0 #fff}
h1:after{content:"◆  ◇  ◆";display:block;margin:4px auto 0;font-size:8px;letter-spacing:.65em;color:#b28a4d;text-align:center}
.guide{margin:5px 0 0;min-height:3em;max-width:30em;font-size:clamp(11px,1.8dvh,13px);line-height:1.55;color:#675036;text-align:center;transition:opacity .3s}
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:6px 0}
.paper{position:relative;width:100%;max-height:100%;aspect-ratio:36/28;background:linear-gradient(135deg,#efe2c3,#e3d0a8 55%,#d9c194);border:1px solid #a98853;box-shadow:inset 0 0 40px rgba(120,84,40,.35),0 8px 18px rgba(81,53,22,.18);border-radius:3px}
.paper:before{content:"";position:absolute;inset:8px;border:1px dashed rgba(120,84,40,.35);pointer-events:none}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.edge{stroke:#7d5d36;stroke-width:2.2;stroke-linecap:round;opacity:.55;stroke-dasharray:1 0}
.edge.faint{stroke-dasharray:5 4}
.trail{stroke:#d9a336;stroke-width:6;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 4px #ffe2a0) drop-shadow(0 0 2px #fff)}
.trail-head{fill:none;stroke:#d9a336;stroke-width:3;opacity:.6}
.node .ring{fill:#f6ecd4;stroke:#7d5d36;stroke-width:2}
.node .core{fill:#7d5d36}
.node.lit .ring{fill:#fff4cf;stroke:#c18c20;stroke-width:2.6;filter:drop-shadow(0 0 5px #ffd67a)}
.node.lit .core{fill:#c18c20}
.node.can .ring{stroke:#c18c20;stroke-dasharray:3 2}
.node.hint .ring{animation:hint 1.2s ease-in-out 2}
@keyframes hint{50%{fill:#ffe08a;stroke:#b07a12}}
.node.start .ring,.node.goal .ring{stroke-width:3}
.label{font-size:11px;fill:#5a3f22;text-anchor:middle;paint-order:stroke;stroke:#efe2c3;stroke-width:4px;pointer-events:none}
.compass{fill:none;stroke:rgba(110,78,40,.45);stroke-width:1}
.compass-t{font-size:9px;fill:rgba(110,78,40,.7);text-anchor:middle}
svg.linked .trail{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{stroke:#ffcf5a;filter:drop-shadow(0 0 9px #ffd77a) drop-shadow(0 0 3px #fff)}}
.ring2{fill:none;stroke:#7d5d36;stroke-width:1.6}
.node.lit .ring2{stroke:#c18c20}
svg.fade .edge,svg.fade .node,svg.fade .trail,svg.fade .trail-head{transition:opacity 1.6s ease;opacity:.07}
.reveal{animation:revealIn 2.2s ease forwards;opacity:0}
@keyframes revealIn{to{opacity:1}}
.status{margin:0;padding:5px 18px;font-size:12px;letter-spacing:.1em;color:#6b5030;background:linear-gradient(90deg,transparent,#fff9eb 20%,#fff9eb 80%,transparent);border-top:1px solid rgba(162,119,51,.27);border-bottom:1px solid rgba(162,119,51,.27)}
.status b{color:#9c6c20;font-weight:600;font-size:15px}
.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;justify-content:center}
button{appearance:none;font:inherit;font-size:12px;letter-spacing:.12em;color:#513a22;background:linear-gradient(180deg,#fffdf5,#e8d9bc);border:1px solid #a27b42;padding:9px 16px;min-height:40px;border-radius:0;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(87,57,24,.17);cursor:pointer}
button:active{filter:brightness(.93)}button:disabled{opacity:.45}
.note{margin:7px 0 0;font-size:10px;line-height:1.5;color:#786245;text-align:center}
</style>
</head>
<body>
<main>
  <p class="chapter">ZERAPHIA　/　第六章・道しるべ</p>
  <button id="exitBtn" type="button">戻る</button>
  <h1 id="title">道しるべ</h1>
  <p class="guide" id="guide"></p>
  <div class="stage"><div class="paper"><svg id="board" viewBox="0 0 360 280" role="group" aria-label="図形が描かれた古い紙"></svg></div></div>
  <p class="status" id="status"></p>
  <div class="controls">
    <button type="button" id="backBtn">ひとつ戻る</button>
    <button type="button" id="resetBtn">最初から</button>
    <button type="button" id="hintBtn">ヒント（残り3）</button>
  </div>
  <p class="note">指でなぞるか、隣の印をタップして進む。<br>通った印をタップすると、そこまで戻る。</p>
</main>

<script>
/*LOGIC_START*/
// 盤面: nodes=[x,y](viewBox 360x280), edges=[a,b], start/goal=ノード番号
// ルール: start から、すべての印をちょうど一度ずつ通り、最後に goal へ着く
const LEVELS = [
  { name:'一枚目', revealImage:'images/ch06_paper1_reveal.webp', intro:'塔の壁から見つかった紙。<br>光る印から始めて、すべての印を一度ずつ通り、<br>二重の印で終えよう。',
    nodes:[[47, 30], [138, 27], [217, 29], [315, 27], [53, 100], [127, 96], [228, 107], [306, 101], [39, 175], [127, 165], [222, 163], [322, 174], [38, 237], [127, 234], [224, 243], [308, 233]],
    edges:[[0, 1], [0, 4], [1, 4], [1, 2], [1, 5], [1, 6], [2, 3], [2, 6], [2, 7], [3, 7], [4, 5], [4, 8], [5, 8], [6, 9], [6, 7], [6, 10], [7, 10], [7, 11], [8, 9], [8, 12], [9, 12], [9, 10], [9, 13], [9, 14], [10, 14], [11, 15], [12, 13], [13, 14], [14, 15]],
    start:4, goal:11 },
  { name:'二枚目', revealImage:'images/ch06_paper2_reveal.webp', intro:'トイフェルが持っていた紙。<br>光る印から始めて、すべての印を一度ずつ通り、<br>二重の印で終えよう。',
    nodes:[[47, 35], [117, 31], [174, 32], [253, 29], [330, 28], [47, 95], [106, 109], [188, 107], [252, 108], [331, 108], [40, 171], [107, 167], [178, 164], [260, 171], [329, 177], [39, 244], [109, 232], [174, 246], [255, 235], [323, 234]],
    edges:[[0, 1], [0, 5], [1, 5], [1, 2], [1, 6], [1, 7], [2, 3], [2, 7], [2, 8], [3, 4], [3, 8], [3, 9], [4, 9], [5, 6], [5, 10], [6, 10], [6, 11], [7, 8], [7, 12], [7, 13], [8, 9], [8, 13], [9, 13], [10, 11], [10, 15], [11, 15], [11, 12], [11, 16], [12, 16], [12, 13], [12, 18], [13, 14], [13, 18], [13, 19], [15, 16], [16, 17], [17, 18], [18, 19]],
    start:5, goal:14 }
];
function adjOf(L){ const a=L.nodes.map(()=>[]); L.edges.forEach(([u,v])=>{a[u].push(v);a[v].push(u);}); return a; }
// 一筆の解をすべて数える(最大limit件)
function solutions(L,limit){
  const n=L.nodes.length, adj=adjOf(L), out=[], vis=new Array(n).fill(false);
  const path=[L.start]; vis[L.start]=true;
  (function dfs(u){
    if(out.length>=limit) return;
    if(path.length===n){ if(u===L.goal) out.push(path.slice()); return; }
    if(u===L.goal) return;
    for(const v of adj[u]) if(!vis[v]){ vis[v]=true; path.push(v); dfs(v); path.pop(); vis[v]=false; }
  })(L.start);
  return out;
}
/*LOGIC_END*/

(function(){
  'use strict';
  window.sendMapEvent=function(type){
    try{
      if(type==='zeraphia-map-cleared'&&typeof window.zeraphiaMapClear==='function'){window.zeraphiaMapClear();return;}
      if(type==='zeraphia-map-exit'&&typeof window.zeraphiaMapExit==='function'){window.zeraphiaMapExit();return;}
      parent.postMessage({type},location.origin);
    }catch(e){console.error(e);}
  };
  const NS='http://www.w3.org/2000/svg', R=13;
  const svg=document.getElementById('board'), guide=document.getElementById('guide'), statusEl=document.getElementById('status');
  const HINT_MAX=3;
  let li=0, L=null, adj=null, sol=null, path=[], solved=false, hintsLeft=HINT_MAX, dragging=false;
  const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

  function load(i){
    li=i; L=LEVELS[i]; adj=adjOf(L); sol=solutions(L,2)[0]; path=[L.start]; solved=false;
    svg.classList.remove('linked');
    document.getElementById('title').textContent='道しるべ　'+L.name;
    guide.innerHTML=L.intro;
    draw();
  }

  function draw(hintNode){
    svg.innerHTML=''; svg.classList.remove('fade');
    // 線
    L.edges.forEach(([a,b])=>{const [x1,y1]=L.nodes[a],[x2,y2]=L.nodes[b]; el('line',{class:'edge faint',x1,y1,x2,y2},svg);});
    // 光の軌跡
    if(path.length>1) el('polyline',{class:'trail',points:path.map(i=>L.nodes[i].join(',')).join(' ')},svg);
    const last=path[path.length-1];
    const can=new Set(solved?[]:adj[last].filter(v=>!path.includes(v)&&(v!==L.goal||path.length===L.nodes.length-1)));
    L.nodes.forEach(([x,y],i)=>{
      const cls=['node']; if(path.includes(i))cls.push('lit'); if(can.has(i))cls.push('can'); if(i===L.start)cls.push('start'); if(i===L.goal)cls.push('goal'); if(i===hintNode)cls.push('hint');
      const g=el('g',{class:cls.join(' '),'data-i':i,transform:`translate(${x} ${y})`},svg);
      el('circle',{class:'ring',r:R},g);
      // 印(塔の紋)
      el('path',{class:'core',d:'M0 -7 L5 0 L0 7 L-5 0Z'},g);
      if(i===L.goal) el('circle',{class:'ring2',r:R+5},g);
    });
    if(!solved && path.length>1) el('circle',{class:'trail-head',cx:L.nodes[last][0],cy:L.nodes[last][1],r:R+5},svg);
    updateStatus();
  }

  // 解いたあとに浮かび上がる紋様の画像（後で用意する。画像がなければ何も出さない）
  function drawReveal(){
    if(!L.revealImage) return;
    const img=el('image',{class:'reveal',href:L.revealImage,x:0,y:0,width:360,height:280,preserveAspectRatio:'xMidYMid meet'},svg);
    img.addEventListener('error',()=>img.remove());
  }

  function updateStatus(){
    statusEl.innerHTML=`${L.name}（${li+1} / ${LEVELS.length}）　灯った印 <b>${path.length}</b> / ${L.nodes.length}`;
    const hb=document.getElementById('hintBtn'); hb.textContent=`ヒント（残り${hintsLeft}）`; hb.disabled=solved||hintsLeft<=0;
    document.getElementById('backBtn').disabled=solved||path.length<=1;
    document.getElementById('resetBtn').disabled=solved;
  }

  function tryVisit(i){
    if(solved||i==null) return false;
    const last=path[path.length-1];
    if(i===last) return false;
    const idx=path.indexOf(i);
    if(idx>=0){ path=path.slice(0,idx+1); draw(); return true; }      // 通った印 → そこまで戻る
    if(!adj[last].includes(i)) return false;                          // 線でつながっていない
    if(i===L.goal && path.length<L.nodes.length-1){ guide.innerHTML='二重の印は、最後にたどり着く場所。<br>まだ灯っていない印がある。'; return false; }
    path.push(i); afterMove(); return true;
  }

  function afterMove(){
    const last=path[path.length-1];
    if(path.length===L.nodes.length && last===L.goal){ win(); return; }
    const next=adj[last].filter(v=>!path.includes(v)&&(v!==L.goal||path.length===L.nodes.length-1));
    guide.innerHTML = next.length ? L.intro : '……光が、途切れてしまった。<br>通った印をタップすると、そこまで戻れる。';
    draw();
  }

  function win(){
    solved=true; dragging=false; draw(); svg.classList.add('linked');
    guide.innerHTML='……つながった。';
    const final=li+1>=LEVELS.length;
    setTimeout(()=>{
      svg.classList.add('fade'); drawReveal();
      guide.innerHTML='光の線がほどけ、紙の上に、何かが浮かび上がる……';
    },1300);
    setTimeout(()=>{ if(!final) load(li+1); else { statusEl.innerHTML='二枚の紙が、すべてつながった'; window.sendMapEvent('zeraphia-map-cleared'); } }, final?5600:4600);
  }

  function nodeAt(clientX,clientY,radius){
    const p=svg.createSVGPoint(); p.x=clientX; p.y=clientY;
    const m=svg.getScreenCTM(); if(!m) return null;
    const q=p.matrixTransform(m.inverse());
    let best=null,bd=1e9;
    L.nodes.forEach(([x,y],i)=>{const d=Math.hypot(x-q.x,y-q.y); if(d<bd){bd=d;best=i;}});
    return bd<=radius?best:null;
  }
  svg.addEventListener('pointerdown',e=>{
    if(solved) return; e.preventDefault();
    const i=nodeAt(e.clientX,e.clientY,R+10);
    if(i===path[path.length-1]){ dragging=true; svg.setPointerCapture(e.pointerId); return; }
    if(tryVisit(i)){ dragging=true; svg.setPointerCapture(e.pointerId); }
  });
  svg.addEventListener('pointermove',e=>{
    if(!dragging||solved) return;
    const i=nodeAt(e.clientX,e.clientY,R+4); if(i==null) return;
    const last=path[path.length-1];
    if(path.length>1 && i===path[path.length-2]){ path.pop(); draw(); return; } // なぞり戻し
    if(i!==last && !path.includes(i)) tryVisit(i);
  });
  const end=()=>{dragging=false;};
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);

  function showHint(){
    if(solved||hintsLeft<=0) return;
    // いまの道が正解の途中なら次の印、違っていれば戻る場所を示す
    let k=0; while(k<path.length&&path[k]===sol[k]) k++;
    hintsLeft--;
    if(k===path.length){ draw(sol[k]); guide.innerHTML='ヒント：光った印へ。'; }
    else { draw(sol[k-1]); guide.innerHTML='ヒント：光った印まで戻ってみよう。'; }
  }

  document.getElementById('backBtn').addEventListener('click',()=>{ if(!solved&&path.length>1){ path.pop(); guide.innerHTML=L.intro; draw(); } });
  document.getElementById('resetBtn').addEventListener('click',()=>{ if(!solved){ path=[L.start]; guide.innerHTML=L.intro; draw(); } });
  document.getElementById('hintBtn').addEventListener('click',showHint);
  document.getElementById('exitBtn').addEventListener('click',()=>window.sendMapEvent('zeraphia-map-exit'));
  const q=new URLSearchParams(location.search).get('level');
  load(q?Math.max(0,Math.min(LEVELS.length-1,Number(q)-1)):0);
})();
</script>
</body>
</html>
