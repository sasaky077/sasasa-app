<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>共鳴灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ZERAPHIA 9章 共鳴灯（ストーリー用パズル）
   ステージ選択から iframe で開かれ、全段階クリアで親へ zeraphia-ring-cleared、戻るで zeraphia-ring-exit を送る。
   URL: resonance_lamp_ch09.html?levels=1,2,3&mode=normal|beginner&title=灯の扉
   build1732: ヒントは各段階3回まで／灯・盤面・クリア演出をリッチ化 */
:root{
  --paper:#f1eadb; --panel:#fbf7ee; --ink:#3a3024; --muted:#7d6c55; --line:#cdbf9f;
  --gold:#b08a3c; --gold-deep:#8a6a2a; --gold-soft:#e7cf96;
  --off:#d9cfbb; --on:#f4c45e; --glow:rgba(244,196,94,.65); --hint:#4f78b0; --ok:#4c8a58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{background:
    radial-gradient(ellipse at 50% 36%,rgba(255,236,190,.55) 0%,rgba(255,236,190,0) 46%),
    radial-gradient(ellipse at 50% 30%,#fbf6ea 0%,var(--paper) 60%,#ddd0b4 100%);
  color:var(--ink);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;-webkit-user-select:none;user-select:none}
body::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(110,84,44,.22)}

/* 漂う光の粒 */
.motes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.motes i{position:absolute;bottom:-12px;width:var(--s,5px);height:var(--s,5px);border-radius:50%;
  background:radial-gradient(circle,#fff8df 0%,rgba(244,196,94,.85) 40%,rgba(244,196,94,0) 72%);
  opacity:0;animation:moteRise var(--d,11s) linear var(--delay,0s) infinite}
@keyframes moteRise{0%{transform:translate(0,0);opacity:0}12%{opacity:.85}80%{opacity:.5}100%{transform:translate(var(--dx,20px),-105vh);opacity:0}}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{font:600 13px "Noto Serif JP",serif;color:var(--muted);background:rgba(251,247,238,.7);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.kicker{font:600 10.5px "Cinzel",serif;letter-spacing:.26em;color:var(--gold-deep);text-align:right}
.kicker b{display:block;margin-top:2px;font:700 18px "Noto Serif JP",serif;letter-spacing:.1em;color:var(--ink);text-shadow:0 1px 0 #fff}

/* 段階：菱形の灯 */
.steps{display:flex;gap:12px;justify-content:center;align-items:center;min-height:16px}
.steps i{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--line);background:var(--off);transition:all .3s}
.steps i.done{background:var(--gold);border-color:var(--gold-deep)}
.steps i.now{background:var(--on);border-color:var(--gold);box-shadow:0 0 10px var(--glow);animation:pipGlow 1.6s ease-in-out infinite alternate}
@keyframes pipGlow{to{box-shadow:0 0 16px var(--glow),0 0 2px #fff}}

.rule{max-width:440px;width:100%;margin:0;font-size:13px;line-height:1.7;color:var(--muted);text-align:center;min-height:2.6em}
.status{width:100%;max-width:400px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{color:var(--ink);font-size:15px}
.meter{display:flex;gap:3px;align-items:center}
.meter i{width:7px;height:7px;border-radius:50%;background:var(--off);transition:background .2s,box-shadow .2s}
.meter i.on{background:var(--on);box-shadow:0 0 5px var(--glow)}

.stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
/* 盤：金の二重枠＋四隅の飾り */
.frame{position:relative;padding:7px;border-radius:22px;
  background:linear-gradient(145deg,#f3e2b4,#b48e44 28%,#f6e7bd 52%,#a88136 78%,#ecd9a6);
  box-shadow:0 14px 30px rgba(90,70,40,.22),0 2px 0 rgba(255,255,255,.6) inset}
.frame::before,.frame::after{content:'✦';position:absolute;font-size:13px;color:#fff6dc;text-shadow:0 0 6px rgba(176,138,60,.9);line-height:1}
.frame::before{left:50%;top:-8px;transform:translateX(-50%)}
.frame::after{left:50%;bottom:-8px;transform:translateX(-50%)}
.board{position:relative;display:grid;gap:clamp(7px,2.2vw,11px);width:min(84vw,44vh,390px);aspect-ratio:1;padding:clamp(12px,3.4vw,18px);
  border-radius:16px;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,240,200,.0) 0%,rgba(255,240,200,0) 40%),
    repeating-radial-gradient(circle at 50% 50%,rgba(176,138,60,.06) 0 2px,transparent 2px 22px),
    linear-gradient(180deg,#fffaf0,#efe3c8);
  box-shadow:inset 0 0 0 1px rgba(138,106,42,.35),inset 0 0 26px rgba(138,106,42,.18)}
.board.all-lit{animation:boardBloom 1.4s ease-out forwards}
@keyframes boardBloom{0%{box-shadow:inset 0 0 0 1px rgba(138,106,42,.35),inset 0 0 26px rgba(138,106,42,.18)}
  45%{box-shadow:inset 0 0 0 1px rgba(255,220,140,.9),inset 0 0 70px rgba(255,214,120,.75)}
  100%{box-shadow:inset 0 0 0 1px rgba(255,220,140,.7),inset 0 0 44px rgba(255,214,120,.45)}}

/* 灯 */
.cell{position:relative;border-radius:50%;border:1px solid #c2b089;padding:0;cursor:pointer;
  background:radial-gradient(circle at 38% 32%,#f4ecdc 0%,#e4d9c3 45%,#cdbf9f 100%);
  box-shadow:inset 0 -3px 6px rgba(110,84,44,.22),inset 0 2px 3px rgba(255,255,255,.75),0 2px 4px rgba(90,70,40,.15);
  display:grid;place-items:center;transition:background .22s,box-shadow .22s,border-color .22s,transform .08s}
.cell .core{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,#efe6d4,#d6cab0);
  box-shadow:inset 0 1px 2px rgba(110,84,44,.25);transition:all .25s}
.cell::after{content:'';position:absolute;inset:-18%;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,214,120,.55) 0%,rgba(255,214,120,.18) 45%,rgba(255,214,120,0) 70%);transition:opacity .25s}
.cell.on{border-color:#d6a13c;
  background:radial-gradient(circle at 40% 34%,#fffbe8 0%,#ffe08a 34%,var(--on) 60%,#d8962f 100%);
  box-shadow:0 0 14px var(--glow),inset 0 -3px 6px rgba(160,100,20,.3),inset 0 2px 4px rgba(255,255,255,.9)}
.cell.on .core{inset:22%;background:radial-gradient(circle,#ffffff 0%,#fff3c4 45%,rgba(255,224,138,0) 100%);box-shadow:none;animation:flicker 2.4s ease-in-out infinite}
.cell.on::after{opacity:1}
@keyframes flicker{0%,100%{transform:scale(1);opacity:1}40%{transform:scale(1.06);opacity:.92}70%{transform:scale(.97);opacity:1}}
.cell:active{transform:scale(.92)}
/* 反転の波紋（押した灯→つながった灯へ順に） */
.cell .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(244,196,94,.9);opacity:0;pointer-events:none}
.cell.flip .ring{animation:ripple .55s ease-out var(--fd,0ms) both}
.cell.flip{animation:pop .32s ease-out var(--fd,0ms) both}
@keyframes ripple{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.55);opacity:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
.cell.linked{box-shadow:0 0 0 3px rgba(79,120,176,.55),inset 0 -3px 6px rgba(110,84,44,.22)}
.cell.on.linked{box-shadow:0 0 0 3px rgba(79,120,176,.55),0 0 14px var(--glow)}
.cell.self{box-shadow:0 0 0 3px var(--hint)}
.cell.on.self{box-shadow:0 0 0 3px var(--hint),0 0 14px var(--glow)}
.cell.hinted{animation:hintPulse .7s ease-in-out infinite alternate}
@keyframes hintPulse{from{box-shadow:0 0 0 3px var(--hint)}to{box-shadow:0 0 0 8px rgba(79,120,176,.3),0 0 20px var(--hint)}}
.cell .arrow{position:relative;z-index:2;font:700 clamp(13px,4vw,18px) "Noto Serif JP",serif;color:#8d7b5d;opacity:.85}
.cell.on .arrow{color:#6b4a0c}
.cell.cascade{animation:cascade .7s ease-out var(--cd,0ms) both}
@keyframes cascade{0%{filter:brightness(1)}40%{filter:brightness(1.45) drop-shadow(0 0 10px #ffd877)}100%{filter:brightness(1.08)}}

.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:600 13.5px "Noto Serif JP",serif;color:var(--ink);background:linear-gradient(180deg,#fffdf7,var(--panel));border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;min-width:84px;
  box-shadow:0 2px 0 rgba(176,138,60,.18)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{border-color:var(--gold);background:linear-gradient(180deg,#fff6df,#f1dfb2);font-weight:700}
.btn:disabled{opacity:.45}
.btn .left{display:inline-block;margin-left:4px;font:700 11px "Cinzel",serif;color:var(--hint);letter-spacing:.04em}
.btn:disabled .left{color:var(--muted)}
.btn:focus-visible,.cell:focus-visible,.back:focus-visible{outline:2px solid var(--hint);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:max(84px,calc(env(safe-area-inset-bottom) + 74px));transform:translate(-50%,8px);padding:7px 14px;border-radius:999px;
  background:rgba(58,48,36,.86);color:#fff6e0;font-size:12.5px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:5;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toggle{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}

/* クリア */
.banner{position:fixed;inset:0;display:grid;place-items:center;background:rgba(241,234,219,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:6;overflow:hidden}
.banner.show{opacity:1;pointer-events:auto}
.banner .rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);opacity:.5;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,226,150,.0) 0deg 9deg,rgba(255,226,150,.45) 9deg 12deg);
  -webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 22%,transparent 50%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.5) 22%,transparent 50%)}
.banner.show .rays{animation:raySpin 18s linear infinite}
@keyframes raySpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.banner .card{position:relative;text-align:center;padding:24px 34px 20px;background:linear-gradient(180deg,#fffdf6,var(--panel));border:1px solid var(--gold);border-radius:14px;
  box-shadow:0 14px 34px rgba(90,70,40,.26),0 0 0 4px rgba(255,255,255,.55),0 0 0 5px rgba(176,138,60,.35);transform:scale(.92);transition:transform .45s cubic-bezier(.2,1.5,.4,1)}
.banner.show .card{transform:scale(1)}
.banner .lamp{width:42px;height:42px;margin:0 auto 8px;border-radius:50%;
  background:radial-gradient(circle at 40% 34%,#fffbe8 0%,#ffe08a 34%,var(--on) 60%,#d8962f 100%);box-shadow:0 0 22px var(--glow),0 0 50px rgba(244,196,94,.35);animation:flicker 2.4s ease-in-out infinite}
.banner small{display:block;font:600 11px "Cinzel",serif;letter-spacing:.3em;color:var(--gold-deep)}
.banner strong{display:block;margin:6px 0 4px;font-size:20px;letter-spacing:.12em}
.banner p{margin:0 0 14px;font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  .cell,.cell .core{transition:none}.cell.on .core,.banner .lamp,.steps i.now{animation:none}
  .cell.flip,.cell.flip .ring,.cell.cascade,.board.all-lit,.banner.show .rays,.motes i{animation:none}
  .cell.hinted{animation:none;box-shadow:0 0 0 4px var(--hint)}}
</style>
</head>
<body>
<div class="motes" id="motes" aria-hidden="true"></div>
<div class="app">
  <header>
    <button class="back" type="button" id="back">戻る</button>
    <div class="kicker">RESONANCE LAMP<b id="title">共鳴灯</b></div>
  </header>
  <div class="steps" id="steps" aria-label="進み具合"></div>
  <p class="rule" id="rule"></p>
  <div class="status"><span>手数 <b id="moves">0</b></span><span class="meter" id="meter" aria-hidden="true"></span><span id="state">すべての灯をともす</span></div>
  <div class="stage"><div class="frame"><div class="board" id="lamp-board" role="grid" aria-label="灯の盤"></div></div></div>
  <label class="toggle" id="show-wrap" hidden><input type="checkbox" id="show"> つながりを表示</label><!-- 表示の有無は段階ごとに固定（初級は常に表示） -->
  <div class="actions">
    <button class="btn" type="button" id="hint">ヒント<span class="left" id="hint-left"></span></button>
    <button class="btn" type="button" id="undo">1手戻す</button>
    <button class="btn" type="button" id="reset">最初から</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="banner" id="banner" role="dialog" aria-live="polite">
  <div class="rays" aria-hidden="true"></div>
  <div class="card">
    <div class="lamp" aria-hidden="true"></div>
    <small id="banner-kicker">CLEAR</small>
    <strong id="banner-text">灯がそろった</strong>
    <p id="banner-sub"></p>
    <button class="btn primary" type="button" id="banner-btn">次へ</button>
  </div>
</div>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const rnd=n=>Math.floor(Math.random()*n);
  const q=new URLSearchParams(location.search);
  const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ヒントは各段階ごとにこの回数まで（段階が変わると回復）
  const HINT_LIMIT=3;
  // 段階（試作で決めた順。3×3 → 4×4。5×5は後半の章用）
  const STAGES={
    1:{n:3,rule:'cross',min:1,max:2,show:true},
    2:{n:3,rule:'cross',min:3,max:3,show:true},
    3:{n:3,rule:'cross',min:3,max:4,show:false},
    4:{n:3,rule:'arrow',min:2,max:3,show:true},
    5:{n:4,rule:'cross',min:3,max:4,show:true},
    6:{n:4,rule:'cross',min:5,max:6,show:false},
    7:{n:4,rule:'arrow',min:4,max:5,show:false},
    8:{n:5,rule:'row',min:6,max:6,show:false},
  };
  const RULE_TEXT={
    cross:'灯に触れると、その灯と上下左右の灯が反転する。\nすべての灯をともそう。',
    arrow:'灯に触れると、その灯と矢印の先の灯が反転する。\nつながりは一方通行。',
    row:'灯に触れると、同じ行と列の灯がすべて反転する。',
  };
  const levels=(q.get('levels')||'1,2,3').split(',').map(Number).filter(n=>STAGES[n]);
  const beginner=q.get('mode')==='beginner';
  if(q.get('title')) $('title').textContent=q.get('title');
  const ARROWS=[[-1,0,'↑'],[1,0,'↓'],[0,-1,'←'],[0,1,'→']];
  let li=0, cfg, links, arrows, state, start, picks, pressed, history, moves, hint=null, solvedLevel=false, hintsLeft=HINT_LIMIT, hintsUsed=0;

  // 漂う光の粒
  if(!reduceMotion){
    const m=$('motes');
    for(let k=0;k<16;k++){
      const i=document.createElement('i');
      i.style.left=(Math.random()*100)+'%';
      i.style.setProperty('--s',(3+Math.random()*5).toFixed(1)+'px');
      i.style.setProperty('--d',(9+Math.random()*9).toFixed(1)+'s');
      i.style.setProperty('--delay',(-Math.random()*16).toFixed(1)+'s');
      i.style.setProperty('--dx',((Math.random()-.5)*80).toFixed(0)+'px');
      m.appendChild(i);
    }
  }

  let toastTimer=0;
  function toast(text){
    const t=$('toast'); t.textContent=text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
  }

  function buildLinks(){
    const n=cfg.n; links=[]; arrows=[];
    for(let i=0;i<n*n;i++){
      const r=Math.floor(i/n), c=i%n, set=new Set([i]);
      const add=(rr,cc)=>{if(rr>=0&&rr<n&&cc>=0&&cc<n) set.add(rr*n+cc);};
      if(cfg.rule==='cross'){add(r-1,c);add(r+1,c);add(r,c-1);add(r,c+1);}
      else if(cfg.rule==='row'){for(let k=0;k<n;k++){add(r,k);add(k,c);}}
      else if(cfg.rule==='arrow'){
        const ok=ARROWS.filter(([dr,dc])=>r+dr>=0&&r+dr<n&&c+dc>=0&&c+dc<n);
        const a=ok[rnd(ok.length)]; arrows[i]=a[2]; add(r+a[0],c+a[1]);
      }
      links.push([...set]);
    }
  }
  const press=(st,i)=>links[i].forEach(j=>st[j]=!st[j]);
  // 問題は「全灯ON」から出題用に何手か押して作るので必ず解ける
  function newPuzzle(){
    cfg=STAGES[levels[li]]; buildLinks();
    const N=cfg.n*cfg.n, k=cfg.min+rnd(cfg.max-cfg.min+1);
    let st,tries=0;
    do{st=new Array(N).fill(true);const set=new Set();while(set.size<Math.min(k,N))set.add(rnd(N));picks=[...set];picks.forEach(i=>press(st,i));tries++;}
    while(st.every(Boolean)&&tries<20);
    start=st.slice(); state=st; pressed=[]; history=[]; moves=0; hint=null; solvedLevel=false;
    hintsLeft=HINT_LIMIT; hintsUsed=0;
    $('show').checked=beginner||cfg.show;
    const b=$('lamp-board'); b.innerHTML=''; b.classList.remove('all-lit');
    $('rule').textContent=RULE_TEXT[cfg.rule]+(($('show').checked)?'':'（つながりは見えない）');
    $('state').textContent='すべての灯をともす';
    render();
  }
  function render(focus){
    const n=cfg.n, b=$('lamp-board');
    b.style.gridTemplateColumns=`repeat(${n},1fr)`;
    if(!b.children.length){
      for(let i=0;i<n*n;i++){
        const el=document.createElement('button');el.type='button';el.className='cell';
        el.innerHTML='<span class="core"></span><span class="ring"></span>'+(cfg.rule==='arrow'?`<span class="arrow">${arrows[i]}</span>`:'');
        el.addEventListener('click',()=>tap(i));b.appendChild(el);
      }
    }
    const show=$('show').checked;
    [...b.children].forEach((el,i)=>{
      el.classList.toggle('on',state[i]);
      el.classList.toggle('hinted',hint===i);
      el.classList.toggle('self',!!(show&&focus!=null&&i===focus));
      el.classList.toggle('linked',!!(show&&focus!=null&&i!==focus&&links[focus].includes(i)));
      el.setAttribute('aria-label',`${Math.floor(i/n)+1}行${i%n+1}列 ${state[i]?'灯っている':'消えている'}`);
    });
    $('moves').textContent=moves;
    const lit=state.filter(Boolean).length;
    $('meter').innerHTML=state.map((_,k)=>`<i class="${k<lit?'on':''}"></i>`).join('');
    $('steps').innerHTML=levels.map((_,k)=>`<i class="${k<li?'done':k===li?'now':''}"></i>`).join('');
    $('undo').disabled=!history.length||solvedLevel;
    $('reset').disabled=solvedLevel;
    $('hint').disabled=solvedLevel||hintsLeft<=0;
    $('hint-left').textContent=`残り${hintsLeft}`;
  }
  // 押した灯から、つながった灯へ波紋を順に流す
  function playFlip(i){
    if(reduceMotion) return;
    const b=$('lamp-board'), n=cfg.n, r0=Math.floor(i/n), c0=i%n;
    links[i].forEach(j=>{
      const el=b.children[j]; if(!el) return;
      const d=Math.abs(Math.floor(j/n)-r0)+Math.abs(j%n-c0);
      el.style.setProperty('--fd',(d*55)+'ms');
      el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
    });
  }
  function tap(i){
    if(solvedLevel) return;
    history.push(state.slice()); pressed.push(i); hint=null;
    press(state,i); moves++; render(i); playFlip(i);
    if(state.every(Boolean)) onSolved();
  }
  function onSolved(){
    solvedLevel=true; render();
    $('state').textContent='灯がそろった';
    const b=$('lamp-board'), n=cfg.n;
    if(!reduceMotion){
      [...b.children].forEach((el,j)=>{
        const d=Math.floor(j/n)+(j%n);
        el.style.setProperty('--cd',(220+d*70)+'ms');
        el.classList.remove('cascade'); void el.offsetWidth; el.classList.add('cascade');
      });
      b.classList.add('all-lit');
    }
    const last=li>=levels.length-1;
    setTimeout(()=>{
      $('banner-kicker').textContent=last?'ALL CLEAR':`STEP ${li+1} / ${levels.length}`;
      $('banner-text').textContent=last?'すべての灯がともった':'灯がそろった';
      $('banner-sub').textContent=`手数 ${moves}　・　ヒント ${hintsUsed} / ${HINT_LIMIT}`;
      $('banner-btn').textContent=last?'進む':'次の灯へ';
      $('banner').classList.add('show'); $('banner-btn').focus();
    },reduceMotion?420:1050);
  }
  $('banner-btn').addEventListener('click',()=>{
    $('banner').classList.remove('show');
    if(li>=levels.length-1){ notify('zeraphia-ring-cleared'); return; }
    li++; newPuzzle();
  });
  // ヒント：反転は押した回数の偶奇だけで決まるので、残りの正解手＝出題の手と自分の手の差
  $('hint').addEventListener('click',()=>{
    if(solvedLevel) return;
    if(hint!=null){ toast('光っている灯に触れてみよう'); return; } // 表示中のヒントは消費しない
    if(hintsLeft<=0){ toast('この段階のヒントは使い切った'); return; }
    const cnt=new Map();[...picks,...pressed].forEach(i=>cnt.set(i,(cnt.get(i)||0)+1));
    const need=[...cnt].filter(([,c])=>c%2===1).map(([i])=>i);
    if(!need.length) return;
    hint=need[rnd(need.length)]; hintsLeft--; hintsUsed++;
    render();
    toast(hintsLeft>0?`ヒント 残り${hintsLeft}回`:'この段階のヒントはこれが最後');
  });
  $('undo').addEventListener('click',()=>{if(!history.length||solvedLevel)return;state=history.pop();pressed.pop();moves=Math.max(0,moves-1);hint=null;render();});
  $('reset').addEventListener('click',()=>{if(solvedLevel)return;state=start.slice();pressed=[];history=[];moves=0;hint=null;render();});
  $('show').addEventListener('change',()=>render());
  let notified=false;
  function notify(type){
    if(notified) return; notified=true;
    try{ window.parent && window.parent.postMessage({type},'*'); }catch(_){}
  }
  $('back').addEventListener('click',()=>notify('zeraphia-ring-exit'));
  newPuzzle();
})();
</script>
</body>
</html>
