<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ZERAPHIA | 位相疾走 - PHASE RUSH</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1423;color:#f7f2e8;font-family:system-ui,'Noto Serif JP',serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:auto;background:#101725;position:relative;box-shadow:0 0 60px #0008}.top{height:92px;background:linear-gradient(#20243a,#161b2c);border-bottom:1px solid #bca47466;padding:9px 14px 7px;flex-shrink:0}.tophead{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.13em;color:#c4b798}.tophead b{font-size:14px;color:#f4e3bc}.data{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-top:9px}.data small{display:block;font-size:9px;letter-spacing:.12em;color:#b0b7c7}.data strong{font:700 clamp(16px,4.5vw,23px) system-ui;letter-spacing:.02em}.data .time{color:#efca84}#board{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at center,#273149 0%,#12182a 75%,#101522)}canvas{display:block;width:100%;height:100%;touch-action:none}#message{position:absolute;top:12px;left:50%;transform:translateX(-50%);pointer-events:none;font-size:11px;letter-spacing:.1em;text-align:center;color:#fff0c6;text-shadow:0 0 8px #e8b56f;white-space:nowrap}#hud{height:71px;border-top:1px solid #bca47455;background:linear-gradient(#1a2033,#141a2a);padding:8px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex-shrink:0}#hud div{border:1px solid #ffffff20;padding:6px 4px;text-align:center}#hud small{display:block;color:#b8b9c8;font-size:9px}#hud b{display:block;color:#e9d5a4;font-size:16px}#overlay{position:absolute;inset:0;background:#0c1121da;display:flex;justify-content:center;align-items:center;padding:20px;z-index:5}#overlay.hidden{display:none}.panel{border:1px solid #bba576;background:linear-gradient(160deg,#222b40,#171e30);padding:26px 22px;width:min(100%,390px);text-align:center;box-shadow:0 18px 55px #0009}.eyebrow{letter-spacing:.32em;color:#c7ac79;font-size:11px}.panel h1{font-weight:500;font-size:30px;letter-spacing:.12em;margin:10px 0}.panel p{color:#d0d1db;font-size:12px;line-height:2;margin:16px 0}.primary{background:linear-gradient(#d4bd83,#a88b53);border:0;color:#1b2232;padding:13px 26px;min-width:205px;font-size:14px;font-weight:700;letter-spacing:.12em;cursor:pointer}.secondary{border:1px solid #9b9bad;background:#ffffff12;color:#e7dfd6;padding:10px;font-size:12px;cursor:pointer}.scores{font-size:30px;font-weight:750;color:#f0cf88;margin:8px 0}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0 6px}.option{border:1px solid #a99a7c;background:#ffffff12;color:#eee5d8;padding:18px 3px;min-height:106px;cursor:pointer}.option strong{display:block;font-size:16px;color:#ecd08a}.option small{display:block;margin-top:7px;font-size:10px;color:#c7cbd9}.note{font-size:10px!important;color:#99a7bf!important}.resultrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #fff2;font-size:13px}.resultrow b{color:#e6cc97}@media(max-height:680px){.top{height:78px}.tophead{font-size:10px}.data{margin-top:6px}#hud{height:56px;padding:4px}#hud div{padding:4px}#hud b{font-size:14px}.panel{padding:17px}}
#message{max-width:94%;white-space:normal;line-height:1.6} .evasion{position:absolute;top:42px;left:10px;color:#f6d49c;font-size:13px;font-weight:bold;pointer-events:none;text-shadow:0 2px 4px #000}.meter{position:absolute;top:5px;left:12px;right:12px;height:4px;background:#ffffff30;pointer-events:none}.meter i{display:block;height:100%;background:#e6c990;transition:width .12s} .options{display:none} #overlay{z-index:9} .top{height:98px} .data{grid-template-columns:1.4fr 1fr 1fr} .data strong{font-size:clamp(16px,4vw,23px)} .tophead b{font-size:13px}@media(max-height:700px){.top{height:82px}}</style></head><body><div id="app"><div class="top"><div class="tophead"><span>ZERAPHIA / PHASE RUSH</span><b>位相疾走</b></div><div class="data"><div><small>SCORE</small><strong id="score">0</strong></div><div><small>TIME LEFT</small><strong class="time" id="time">120.0</strong></div><div><small>DEFEATED</small><strong id="kills">0</strong></div></div></div><div id="board"><canvas id="c"></canvas><div id="message"></div><div id="escape" class="evasion"></div><div class="meter"><i id="progress" style="width:0%"></i></div></div><div id="hud"><div><small>CURRENT WAVE</small><b id="combo">WAVE 01/10</b></div><div><small>ATK / RATE</small><b id="atk">+0%</b></div><div><small>ULT / SPACE</small><b id="ult">0%</b></div></div><div id="overlay"><div class="panel" id="panel"></div></div></div>
<script>
(()=>{'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),el=id=>document.getElementById(id),overlay=el('overlay'),panel=el('panel');
let W=400,H=600,DPR=1,mode='title',s=null,last=performance.now();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rand=(a,b)=>a+(b-a)*Math.random();
const WAVES=[
{kind:'swarm',n:5,hp:14,label:'小型雑魚 ×5',limit:5},
{kind:'runner',n:1,hp:90,label:'高速移動型',limit:5},
{kind:'boss',n:1,hp:840,label:'中BOSS / 高耐久'},
{kind:'hits',n:1,hp:42,label:'HIT数型',limit:5},
{kind:'wallguard',n:1,hp:560,label:'遮蔽壁 / 壁の裏の敵',limit:5},
{kind:'shield',n:1,hp:820,label:'中BOSS / バリア'},
{kind:'swarm',n:9,hp:13,label:'低HP群体 ×9',limit:5},
{kind:'vertical',n:5,hp:0,label:'縦一列の敵 ×5',limit:5},
{kind:'runnerboss',n:1,hp:790,label:'中BOSS / 高速移動'},
{kind:'eclipse',n:1,hp:2700,label:'FINAL BOSS / エクリプス'}];
const bonuses=[{id:'rate',name:'射速',detail:'射撃間隔 -15%'},{id:'atk',name:'ATK',detail:'攻撃力 +20%'},{id:'ult',name:'ULT',detail:'ゲージ +50%'},{id:'combo',name:'COMBO',detail:'+50'},{id:'barrier',name:'BARRIER',detail:'被弾1回無効'},{id:'time',name:'TIME',detail:'+5秒'},{id:'score',name:'SCORE',detail:'最終スコア +10%'}];
function resize(){const r=cv.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(devicePixelRatio||1,3);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);if(s){s.p.x=clamp(s.p.x,18,W-18);s.p.y=clamp(s.p.y,70,H-18)}}
new ResizeObserver(resize).observe(cv);resize();
function panelShow(html){panel.innerHTML=html;overlay.classList.remove('hidden')};function panelHide(){overlay.classList.add('hidden')}
function title(){mode='title';panelShow('<div class="eyebrow">ZERAPHIA / NEW MODE</div><h1>位相疾走</h1><div class="eyebrow">P H A S E &nbsp; R U S H</div><p>全10WAVE・制限時間120秒。<br>通常敵は5秒で逃亡。早く倒して次へ！<br>WAVE 03・06・09の中BOSS後は<br>3つのボーナスが盤面に出現します。<br><b>通過して1つ取ると残りは消滅。</b><br>悩んでいる間も時間は進みます。<br>05：遮蔽壁 / 08：縦5体 / 10：エクリプス。</p><p class="note">移動：ドラッグ／マウス　キャラ交代：下部中央タップ・数字1～3<br>ULT：右下タップ・スペース　（独立試作／既存セーブに影響なし）</p><button class="primary" id="start">挑戦する</button><button id="close-phase" style="margin-top:8px">本体へ戻る</button>');el('start').onclick=start;el('close-phase').onclick=()=>parent.postMessage({type:'zeraphia-phase-rush-close'},location.origin)}
function start(){s={time:120,elapsed:0,wave:0,score:0,kills:0,combo:0,peak:0,damage:0,barrier:0,atk:0,rate:0,ult:0,scoreBuff:0,bonuses:[],phase:'spawn',enemies:[],walls:[],shots:[],ebullets:[],items:[],p:{x:W/2,y:H*.83,r:11},shotClock:0,enemyClock:0,escape:0,spawnWait:.65, invuln:0,deathCount:0,stageTimes:[],waveStart:0, messageUntil:0};mode='play';panelHide();message('WAVE 01 / '+WAVES[0].label);updateHUD()}
function message(m){el('message').textContent=m;if(s)s.messageUntil=s.elapsed+2.0}
function newEnemy(hp,kind,x,y){return {x,y,baseX:x,baseY:y,hp,max:hp,kind,t:0,fire:rand(1.0,2),r:['boss','final','eclipse'].includes(kind)?29:kind==='tank'?20:15}}
function spawnWave(){const w=WAVES[s.wave];s.enemies=[];s.walls=[];s.ebullets=[];s.shots=[];s.escape=w.limit||0;s.waveStart=s.elapsed;let y=Math.min(160,H*.26);
 if(w.kind==='swarm')for(let i=0;i<w.n;i++){let col=i%5,row=Math.floor(i/5);s.enemies.push(newEnemy(w.hp,'swarm',W*(col+1)/6,y+row*55))}
 else if(w.kind==='vertical'){for(let i=0;i<5;i++){let kind=i%2===0?'hits':'tank';s.enemies.push(newEnemy(kind==='hits'?14:90,kind,W*.5,Math.min(95,H*.14)+i*Math.min(50,H*.084)))}}
 else if(w.kind==='wallguard'){s.enemies.push(newEnemy(w.hp,'boss',W/2,y));s.walls.push({x:W*.22,y:y+47,w:W*.56,h:19,hp:150,max:150})}
 else {let kind= w.kind==='boss'?'boss':w.kind;s.enemies.push(newEnemy(w.hp,kind,W/2,y))}
 s.phase='fight';message('WAVE '+String(s.wave+1).padStart(2,'0')+' / '+w.label)}
function kill(e){s.enemies.splice(s.enemies.indexOf(e),1);s.kills++;s.combo++;s.peak=Math.max(s.peak,s.combo);s.ult=clamp(s.ult+(e.kind==='boss'||e.kind==='runnerboss'||e.kind==='eclipse'?18:6),0,100);let base=e.kind==='eclipse'?4000000:(['boss','runnerboss','shield'].includes(e.kind)?900000:220000);s.score+=Math.round(base*(1+Math.min(0.1,s.combo*.002)));if(!s.enemies.length){s.stageTimes.push({wave:s.wave+1,seconds:Math.round((s.elapsed-s.waveStart)*10)/10,escaped:false});advance()}}
function advance(){s.phase='transition';s.ebullets=[];s.shots=[];s.walls=[];if(s.wave===9){finish(true);return}if([2,5,8].includes(s.wave)){s.phase='bonus';dropItems();return}s.wave++;s.spawnWait=.38}
function dropItems(){let pool=[...bonuses];for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let selection=pool.slice(0,3),spacing=Math.min(W*.24,93),y=clamp(s.p.y-80,H*.39,H*.72);s.items=selection.map((b,i)=>({...b,x:W/2+(i-1)*spacing,y,r:24}));message('BONUS! 盤面の1つを踏んで取得')}
function grab(b){if(s.phase!=='bonus')return;
 switch(b.id){case 'atk':s.atk=Math.min(.6,s.atk+.2);break;case 'rate':s.rate=Math.min(.45,s.rate+.15);break;case 'ult':s.ult=Math.min(100,s.ult+50);break;case 'combo':s.combo+=50;s.peak=Math.max(s.peak,s.combo);break;case 'barrier':s.barrier++;break;case 'time':s.time+=5;break;case 'score':s.scoreBuff+=.1;break}
 s.bonuses.push(b.id);s.items=[];s.wave++;s.phase='transition';s.spawnWait=.36;message('GET! '+b.name+' / '+b.detail)}
function finish(clear){if(mode!=='play')return;mode='result';const multiplier=1+s.scoreBuff,undamaged=s.damage===0?1.08:1,timeBonus=clear?Math.round(Math.max(0,s.time)*25000):0,clearBonus=clear?1100000:0;let final=Math.round((s.score+timeBonus+clearBonus)*multiplier*undamaged);
 let best=final; // 非公開テスト: 記録は保存しない
 panelShow(`<div class="eyebrow">PHASE RUSH / RESULT</div><h1>${clear?'COMPLETE':'TIME UP'}</h1><div class="scores">${final.toLocaleString('ja-JP')}</div><div class="resultrow"><span>到達WAVE</span><b>${clear?'10 / 10':`${s.wave+1} / 10`}</b></div><div class="resultrow"><span>撃破数</span><b>${s.kills}</b></div><div class="resultrow"><span>コンボ最大</span><b>${s.peak}</b></div><div class="resultrow"><span>残り時間</span><b>${Math.max(0,s.time).toFixed(1)}秒</b></div><div class="resultrow"><span>被弾（バリアは除外）</span><b>${s.damage}</b></div><div class="resultrow"><span>ボーナス</span><b>${s.bonuses.join(' / ')||'-'}</b></div><div class="resultrow"><span>今回のスコア（保存なし）</span><b>${Math.max(best,final).toLocaleString('ja-JP')}</b></div><p class="note">WAVE実測：${s.stageTimes.map(x=>`${x.wave}:${x.seconds}s${x.escaped?'逃':''}`).join(' / ')}</p><p class="note">バランス値は仮置き。既存のゲームデータ・ランキングは変更しません。</p><button class="primary" id="restart">再挑戦</button><button id="close-phase-result" style="margin-top:8px">本体へ戻る</button>`);el('restart').onclick=start;el('close-phase-result').onclick=()=>parent.postMessage({type:'zeraphia-phase-rush-close'},location.origin)}
function useUlt(){if(mode!=='play'||s.phase!=='fight'||s.ult<100)return;s.ult=0;for(let e of [...s.enemies]){e.hp-=e.kind==='hits'?15:260;if(e.hp<=0)kill(e)}s.ebullets=[];message('ULTIMATE!')}
function updateHUD(){if(!s)return;el('score').textContent=Math.round(s.score*(1+s.scoreBuff)).toLocaleString('ja-JP');el('time').textContent=Math.max(0,s.time).toFixed(1);el('kills').textContent=s.kills;el('combo').textContent=String(s.wave+1).padStart(2,'0')+' / 10  · '+s.combo;el('atk').textContent='+'+Math.round(s.atk*100)+'% / +'+Math.round(s.rate*100)+'%';el('ult').textContent=Math.floor(s.ult)+'%'+(s.barrier?' 🛡'+s.barrier:'');el('progress').style.width=((s.wave+1)/10*100)+'%';el('escape').textContent=s.phase==='fight'&&WAVES[s.wave].limit?'ESCAPE  '+Math.max(0,Math.ceil(s.escape)):' '}
function update(dt){if(mode!=='play')return;s.time-=dt;s.elapsed+=dt;s.invuln=Math.max(0,s.invuln-dt);if(s.elapsed>s.messageUntil)el('message').textContent='';if(s.time<=0){s.time=0;finish(false);return}
 if(s.phase==='transition'){s.spawnWait-=dt;if(s.spawnWait<=0)spawnWave();updateHUD();return}
 if(s.phase==='bonus'){for(let b of s.items)if(Math.hypot(s.p.x-b.x,s.p.y-b.y)<s.p.r+b.r){grab(b);break}updateHUD();return}
 const w=WAVES[s.wave];if(w.limit){s.escape-=dt;if(s.escape<=0){let escaped=s.enemies.length;s.stageTimes.push({wave:s.wave+1,seconds:Math.round((s.elapsed-s.waveStart)*10)/10,escaped:true});s.combo=0;s.enemies=[];s.walls=[];message('ESCAPED ×'+escaped);advance();updateHUD();return}}
 s.shotClock-=dt;s.enemyClock-=dt;
 if(s.shotClock<=0){s.shotClock=.17*(1-s.rate);let aim=s.enemies.slice().sort((a,b)=>Math.hypot(a.x-s.p.x,a.y-s.p.y)-Math.hypot(b.x-s.p.x,b.y-s.p.y))[0];if(aim){let dx=aim.x-s.p.x,dy=aim.y-s.p.y, d=Math.hypot(dx,dy)||1;let c=s.active||0;let n=c===1?3:1;for(let i=0;i<n;i++){let ang=Math.atan2(dy,dx)+(i-(n-1)/2)*.14;s.shots.push({x:s.p.x,y:s.p.y-10,vx:Math.cos(ang)*510,vy:Math.sin(ang)*510,r:4,damage:(c===2?42:c===1?8:17)*(1+s.atk)})}}}
 for(let e of s.enemies){e.t+=dt;if(['runner','runnerboss'].includes(e.kind))e.x=clamp(e.baseX+Math.sin(e.t*3.5)*W*.31,25,W-25);else if(e.kind==='swarm')e.x=e.baseX+Math.sin(e.t*1.4+e.baseX)*12;e.fire-=dt;if(e.fire<=0){let a=Math.atan2(s.p.y-e.y,s.p.x-e.x);s.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*125,vy:Math.sin(a)*125,r:5});e.fire=e.kind==='eclipse'?.45:e.kind==='boss'?.8:1.55}}
 for(let p of [...s.shots]){p.x+=p.vx*dt;p.y+=p.vy*dt;
 let intercepted=false;
 for(let wall of [...s.walls]){if(p.x>=wall.x-p.r&&p.x<=wall.x+wall.w+p.r&&p.y>=wall.y-p.r&&p.y<=wall.y+wall.h+p.r){wall.hp-=(s.active||0)===2?p.damage*1.8:p.damage;s.shots.splice(s.shots.indexOf(p),1);if(wall.hp<=0){s.walls.splice(s.walls.indexOf(wall),1);message('遮蔽壁 破壊！')}intercepted=true;break}}
 if(intercepted)continue;
 for(let e of [...s.enemies])if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){let dmg=e.kind==='hits'?1:e.kind==='shield'?Math.max(1,p.damage*.6):p.damage;e.hp-=dmg;s.shots.splice(s.shots.indexOf(p),1);if(e.hp<=0)kill(e);break}}
 for(let p of [...s.ebullets]){p.x+=p.vx*dt;p.y+=p.vy*dt;if(s.invuln<=0&&Math.hypot(p.x-s.p.x,p.y-s.p.y)<s.p.r+p.r){s.ebullets.splice(s.ebullets.indexOf(p),1);s.invuln=.75;if(s.barrier>0){s.barrier--;message('BARRIER!')}else{s.damage++;s.combo=0;message('HIT!')}}}
 s.shots=s.shots.filter(p=>p.x>-40&&p.x<W+40&&p.y>-40&&p.y<H+40);s.ebullets=s.ebullets.filter(p=>p.x>-40&&p.x<W+40&&p.y>-40&&p.y<H+40);updateHUD()}
function draw(){ctx.clearRect(0,0,W,H);ctx.strokeStyle='#cfc6bb1a';ctx.lineWidth=1;let t=s?s.elapsed:0;for(let x=20;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(t*16)%42;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}if(!s)return;
 for(let e of s.enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.kind==='hits'?'#779cbd':e.kind==='shield'?'#94b3a3':e.kind==='eclipse'?'#6c5ba5':e.kind==='swarm'?'#8f6f8f':'#ab788e';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#f4ddbd';ctx.stroke();ctx.fillStyle='#101525';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2,5);ctx.fillStyle=e.kind==='hits'?'#87d4f5':'#f6c789';ctx.fillRect(e.x-e.r,e.y-e.r-13,e.r*2*Math.max(0,e.hp/e.max),5);if(e.kind==='hits'){ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('HIT',e.x,e.y+4)}}
 for(let wall of s.walls){ctx.save();ctx.fillStyle='#64798f';ctx.fillRect(wall.x,wall.y,wall.w,wall.h);ctx.fillStyle='#a9c9db';ctx.fillRect(wall.x+3,wall.y+3,wall.w-6,4);ctx.strokeStyle='#d2e9f2';ctx.lineWidth=2;ctx.strokeRect(wall.x,wall.y,wall.w,wall.h);ctx.fillStyle='#e5b782';ctx.fillRect(wall.x,wall.y-7,wall.w*Math.max(0,wall.hp/wall.max),3);ctx.font='bold 10px system-ui';ctx.fillStyle='#f3f5ff';ctx.textAlign='center';ctx.fillText('遮蔽壁',wall.x+wall.w/2,wall.y+wall.h+14);ctx.restore()}
 for(let e of s.enemies)if(e.kind==='eclipse'){ctx.save();ctx.strokeStyle='#bda9ed';ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,e.r+11,Math.PI*.25,Math.PI*1.85);ctx.stroke();ctx.fillStyle='#ede6ff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('ECLIPSE',e.x,e.y+4);ctx.restore()}
 for(let b of s.items){let color={atk:'#f4a3a1',rate:'#a6d8ff',ult:'#c5b4f3',combo:'#f3d991',barrier:'#98d9b4',time:'#99e1e7',score:'#dcdda5'}[b.id];ctx.save();ctx.translate(b.x,b.y);ctx.shadowColor=color;ctx.shadowBlur=17;ctx.beginPath();ctx.arc(0,0,b.r,0,2*Math.PI);ctx.fillStyle='#202c40';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=color;ctx.stroke();ctx.shadowBlur=0;ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(b.name,0,4);ctx.font='10px system-ui';ctx.fillText(b.detail.replace('射撃間隔 ','').replace('攻撃力 ','').replace('ゲージ ','').replace('最終スコア ',''),0,38);ctx.restore()}
 for(let b of s.ebullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fillStyle='#f2a98b';ctx.fill()}for(let p of s.shots){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='#a6e7ff';ctx.fill()}
 ctx.save();ctx.translate(s.p.x,s.p.y);ctx.globalAlpha=s.invuln>0?.48:1;ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(13,12);ctx.lineTo(0,7);ctx.lineTo(-13,12);ctx.closePath();ctx.fillStyle='#e5edf8';ctx.fill();ctx.strokeStyle='#79c7e6';ctx.lineWidth=2;ctx.stroke();if(s.barrier){ctx.beginPath();ctx.arc(0,0,23,0,7);ctx.strokeStyle='#9eefd0';ctx.stroke()}ctx.restore();ctx.fillStyle='#e6c68b';ctx.font='11px system-ui';ctx.textAlign='left';ctx.fillText('CHAR '+((s.active||0)+1)+' / '+['SPREAD','MULTI','CHARGE'][s.active||0],12,H-15)}
function loop(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function move(e){if(mode!=='play')return;let r=cv.getBoundingClientRect();s.p.x=clamp(e.clientX-r.left,17,W-17);s.p.y=clamp(e.clientY-r.top,65,H-19)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});
el('ult').parentElement.addEventListener('click',useUlt);el('combo').parentElement.addEventListener('click',()=>{if(mode==='play')s.active=((s.active||0)+1)%3});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();useUlt()}if(mode==='play'&&['Digit1','Digit2','Digit3'].includes(e.code))s.active=Number(e.code.slice(-1))-1});title();
})();
</script></body></html>
