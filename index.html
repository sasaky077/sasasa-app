    .result-label { font-size: 12px; color: #b088e0; margin-bottom: 8px; letter-spacing: 1px; }

    .result-btns { display: flex; gap: 8px; margin-top: 12px; }
    .btn-favorite { flex: 1; background: rgba(255,255,255,0.08); border: 0.5px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 10px; color: #e0aaff; font-size: 13px; cursor: pointer; }

    /* 召喚演出モーダル */

    .modal { background: #1a1a2e; border-radius: 20px; border: 0.5px solid rgba(255,255,255,0.15); padding: 20px 16px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }

    .btn-cancel-txt { background: none; border: none; color: #666; font-size: 13px; padding: 8px; cursor: pointer; width: 100%; margin-top: 4px; }
    .compare-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }

    .compare-table td:nth-child(4) { text-align: center; font-size: 11px; font-weight: 500; }
    .diff-plus{color:#4cff8f} .diff-minus{color:#ff5c5c} .diff-new{color:#ffc832} .diff-none{color:#555}
    .total-row td { border-top: 1px solid rgba(255,255,255,0.2); font-weight: 500; font-size: 13px; }
    .compare-btns { display: flex; gap: 10px; }
    .btn-swap { flex: 1; background: rgba(120,50,200,0.5); border: 0.5px solid rgba(180,100,255,0.4); border-radius: 12px; padding: 12px; color: #fff; font-size: 13px; cursor: pointer; }
    .btn-keep { flex: 1; background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 12px; color: #aaa; font-size: 13px; cursor: pointer; }

    .modal-inner p { font-size: 13px; color: #aaa; margin: 8px 0 20px; }
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-ad { background: rgba(255,180,50,0.15); border: 0.5px solid rgba(255,180,50,0.4); border-radius: 12px; padding: 14px; color: #ffc850; font-size: 14px; cursor: pointer; }
    .btn-pay { background: rgba(120,50,200,0.5); border: 0.5px solid rgba(180,100,255,0.4); border-radius: 12px; padding: 14px; color: #fff; font-size: 14px; cursor: pointer; }
    #screen-zukan { background: #0d0f1f; overflow-y: auto; }
    .zukan-stats { margin: 12px 20px; display: flex; gap: 8px; }

    .stat-card-val { font-size: 17px; font-weight: 500; }
    .stat-card-label { font-size: 10px; color: #888; margin-top: 2px; }
    .c-gold{color:#FFD700} .c-silver{color:#C0C0C0} .c-bronze{color:#CD7F32} .c-rainbow{color:#e040fb}
    .zukan-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 12px 20px 32px; }
    .zukan-card {
  border: none;
  aspect-ratio: 1;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.zukan-card::after {
  content: "";
  position: absolute;
  inset: 0px;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
}

.zukan-card.bronze::after {
  background-image: url("images/frame_d.png");
}

.zukan-card.silver::after {
  background-image: url("images/frame_g.png");
}

.zukan-card.gold::after {
  background-image: url("images/frame_k.png");
}

.zukan-card.rainbow::after {
  background-image: url("images/frame_r.png");
}
    .zukan-card.unknown { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08); }
    .zukan-card.unknown::after {
  display: none;
}
    /* 旧frame
    .zukan-card.bronze  { border-color: rgba(205,127,50,0.5); }
    .zukan-card.silver  { border-color: rgba(192,192,192,0.5); }
    .zukan-card.gold    { border-color: rgba(255,215,0,0.6); }
   */
     .zukan-card.rainbow { animation: rborder 2s linear infinite; }
   .zukan-card-img {

}

.card-no {

}
    .card-emoji { font-size: 26px; }
    .card-name { font-size: 9px; color: #fff; text-align: center; padding: 0 2px; }
    .card-question { font-size: 28px; color: #333; }
    .detail-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
#detail-chara-visual img {
  width: 100%;
  max-width: 260px;
  height: auto;

}
    .detail-name { font-size: 18px; font-weight: 500; color: #e0aaff; }
    .detail-rank { font-size: 12px; margin-top: 2px; }
    .detail-photo {
  width: 100%;
  max-height: 160px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 10px;
  opacity: 0.85;
  cursor: pointer;
}
    .btn-set-fav { width: 100%; margin-top: 14px; background: rgba(120,50,200,0.4); border: 0.5px solid rgba(180,100,255,0.4); border-radius: 12px; padding: 12px; color: #e0aaff; font-size: 14px; cursor: pointer; }
    .fav-title-img {
     width: 180px;
     max-width: 70%;
     height: auto;
     display: block;
     margin: 0 auto 12px;
     object-fit: contain;
     filter: drop-shadow(0 0 8px rgba(220,160,255,0.35));
    }
    .photo-zoom {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.photo-zoom img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
  transform: scale(0.95);
  animation: zoomIn 0.2s ease forwards;
}
@keyframes zoomIn {
  to { transform: scale(1); }
}

.summon-flash {
  position: fixed;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 500;
}

.summon-flash.active {
  animation: summonFlash 0.8s ease;
}

@keyframes summonFlash {
  0% { opacity: 0; }
  30% { opacity: 0.9; }
  100% { opacity: 0; }
}
#result-chara-visual img {
  width: 100%;
  max-width: 260px;
  height: auto;

@keyframes resultPop {

    opacity: 0;
    transform: scale(0.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}.compare-chara-visual {

 </style>

<body>

<div id="loading">
  <div class="loading-emoji">✨</div>
  <div class="loading-txt">データを読み込み中...</div>
</div>

<div id="screen-main" class="screen">
  <div class="main-top">
    <img src="images/title.webp" style="width:100%;max-width:400px">
    <div class="user-id-badge" id="user-id-badge"></div>
  </div>
  <div class="favorite-area">
    <img class="fav-title-img" src="images/oshi-title.png" alt="推しキャラ">
    <div id="fav-display"><div class="fav-empty">まだお気に入りがいません</div></div>
  </div>
  <div class="nav-btns">
    <div class="nav-btn summon" onclick="showScreen('summon')">
      <div class="nav-btn-icon">✨</div>
      <div class="nav-btn-label">召喚する</div>
      <div class="nav-btn-sub" id="counter-sub">残り3回</div>
    </div>
    <div class="nav-btn" onclick="showScreen('zukan')">
      <div class="nav-btn-icon">📖</div>
      <div class="nav-btn-label">図鑑</div>
      <div class="nav-btn-sub" id="zukan-sub">0 / 12</div>
    </div>
  </div>
  <div class="id-area">
    <div class="id-box">
      <div class="id-box-label">デバイス間でデータを引き継ぐ</div>
      <div class="id-btns">
        <button class="id-btn" onclick="copyId()">📋 IDをコピー</button>
        <button class="id-btn" onclick="inputId()" style="color:#aaa">✏️ IDを入力</button>
      </div>
      <button onclick="resetData()" style="width:100%;margin-top:10px;background:rgba(255,50,50,0.1);border:0.5px solid rgba(255,80,80,0.3);border-radius:10px;padding:10px;color:#ff6666;font-size:12px;cursor:pointer;">🗑️ データをリセット</button>
    </div>
  </div>
</div>

<div id="screen-summon" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showScreen('main')">＜ 戻る</button>
    <div class="header-title">キャラ召喚</div>
    <div></div>
  </div>
  <div class="summon-counter">
    <span class="counter-label">召喚残り回数</span>
    <span class="counter-val" id="counter-display">3 回</span>
  </div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div class="summon-btns">
    <button class="btn-summon" id="btn-summon" onclick="summonAction()" style="flex:1">カメラを起動</button>
  </div>
  <div id="summon-result">
    <div class="result-label">召喚成功！</div>
    <div id="result-chara-visual"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-rarity-badge" id="result-rarity"></div>
    <img class="result-photo" id="result-photo" />
    <table class="stat-table" id="result-stat-table"></table>
    <div id="result-opts"></div>
    <div class="result-btns">
      <button class="btn-favorite" onclick="setFavoriteFromResult()">★ お気に入り</button>
      <button class="btn-favorite" onclick="showScreen('main')" style="color:#aaa">🏠 ホームへ</button>
    </div>
    <div class="save-status" id="save-status"></div>
  </div>
</div>

<div id="screen-zukan" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showScreen('main')">＜ 戻る</button>
    <div class="header-title">図鑑</div>
    <div></div>
  </div>
  <div class="zukan-stats">
    <div class="stat-card"><div class="stat-card-val" id="stat-total">0</div><div class="stat-card-label">収集数</div></div>
    <div class="stat-card"><div class="stat-card-val c-rainbow" id="stat-rainbow">0</div><div class="stat-card-label">虹</div></div>
    <div class="stat-card"><div class="stat-card-val c-gold" id="stat-gold">0</div><div class="stat-card-label">金</div></div>
    <div class="stat-card"><div class="stat-card-val c-silver" id="stat-silver">0</div><div class="stat-card-label">銀</div></div>
    <div class="stat-card"><div class="stat-card-val c-bronze" id="stat-bronze">0</div><div class="stat-card-label">銅</div></div>
  </div>
  <div class="zukan-grid" id="zukan-grid"></div>
</div>

<div class="modal-overlay" id="compare-modal">
  <div class="modal">
    <h2 id="compare-title"></h2>
    <div class="modal-sub">ステータスを比較して選んでください</div>
    <div id="compare-chara-visual" class="compare-chara-visual"></div>
    <div id="compare-rarity" class="compare-rarity"></div>
    <table class="compare-table">
      <thead><tr><th>ステータス</th><th>今回</th><th>所持中</th><th>差分</th></tr></thead>
      <tbody id="compare-tbody"></tbody>
    </table>
    <div class="compare-btns">
      <button class="btn-swap" onclick="swapChara()">今回と入れ替え</button>
      <button class="btn-keep" onclick="keepChara()">所持中をキープ</button>

  </div>
</div>

  function getRate(id, h, m, isWeekday, isWeekend) {
    if(id===1)  return (isWeekday&&h>=10&&h<17)?80:(isWeekend&&h>=10&&h<17)?40:5;
    if(id===2)  return (h>=22||h<5)?(m%2===0?75:50):((h>=20&&h<22)?30:5);
    if(id===3)  return (h>=17&&h<20)?(isWeekend?80:70):5;
    if(id===4)  return (isWeekday&&h>=5&&h<9)?75:(isWeekend&&h>=5&&h<9)?40:5;
    if(id===5)  return (h>=22||h<5)?40:((h>=5&&h<7)?70:5);
    if(id===6)  return (h>=12&&h<15&&m%2===0)?65:5;
    if(id===7)  return (h>=8&&h<12&&m%5===0)?60:5;
    if(id===8)  return (isWeekend&&h>=13&&h<16)?70:(isWeekday&&h>=13&&h<16)?20:5;
    if(id===9)  return (h>=21&&m%2===1)?70:5;
    if(id===10) return (isWeekend&&h>=14&&h<17)?65:(isWeekday&&h>=14&&h<17)?15:5;
    if(id===11) return (h>=0&&h<4)?75:((h>=22||h<5)?40:5);
    if(id===12) return (isWeekend&&h>=16&&h<19)?70:(isWeekday&&h>=16&&h<19)?20:5;
    return 5;
  }

  function selectChara(now) {
    var h = now.getHours();
    var m = now.getMinutes();
    var wd = now.getDay();
    var isWeekend = (wd===0||wd===6);
    var isWeekday = !isWeekend;
    var rates = CHARACTERS.map(function(c){ return { chara:c, rate:getRate(c.id,h,m,isWeekday,isWeekend) }; });
    var totalRate = rates.reduce(function(a,b){ return a+b.rate; }, 0);
    var rv = Math.random() * totalRate;
    var cumulative = 0;
    for(var i=0; i<rates.length; i++){
      cumulative += rates[i].rate;
      if(rv <= cumulative){ return rates[i].chara; }
    }
    return CHARACTERS[CHARACTERS.length-1];
  }

  async function loadFromDB(){
    var res1 = await sb.from('collected_characters').select('*').eq('user_id', userId);
    if(res1.data){
      res1.data.forEach(function(row){
        var chara = CHARACTERS.find(function(c){ return c.id===row.character_id; });
        if(chara){
          collected[row.character_id] = {
            id:chara.id, name:chara.name, emoji:chara.emoji, img:chara.img,
            base:row.base_stats, opts:row.opt_stats, total:row.total,
            rarity:row.rarity, photo:row.photo_url, time:row.captured_at, db_id:row.id
          };
        }
      });
    }
    var res2 = await sb.from('user_profiles').select('*').eq('user_id', userId);
    var profile = (res2.data&&res2.data.length>0) ? res2.data[0] : null;
    if(profile){ favoriteId = profile.favorite_id; }
  }

  async function saveToDB(data){
    document.getElementById('save-status').textContent = '保存中...';
    var payload = { user_id:userId, character_id:data.id, rarity:data.rarity, base_stats:data.base, opt_stats:data.opts, total:data.total, photo_url:data.photo, captured_at:data.time };
    var result;
    if(data.db_id){
      result = await sb.from('collected_characters').update(payload).eq('id', data.db_id);
    } else {
      result = await sb.from('collected_characters').insert(payload).select();
      if(result.data&&result.data[0]) collected[data.id].db_id = result.data[0].id;
    }
    document.getElementById('save-status').textContent = result.error ? '保存失敗 :(' : '✓ 保存しました';
  }

  async function saveFavoriteToDB(charId){
    var res = await sb.from('user_profiles').select('*').eq('user_id', userId);
    var existing = (res.data&&res.data.length>0) ? res.data[0] : null;
    if(existing){ await sb.from('user_profiles').update({ favorite_id:charId }).eq('user_id', userId); }
    else { await sb.from('user_profiles').insert({ user_id:userId, favorite_id:charId }); }
  }

  function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  function rollStats(){
    var base={};
    BASE_STATS.forEach(function(s){ base[s]=rand(1,99); });
    var pool=OPT_STATS.slice().sort(function(){ return Math.random()-0.5; });
    var opts={}, oc=0;
    for(var i=0;i<3;i++){ if(Math.random()<0.15){ opts[pool[oc]]=rand(1,99); oc++; } }
    var totalBase=Object.values(base).reduce(function(a,b){ return a+b; },0);
    var totalOpt=Object.values(opts).reduce(function(a,b){ return a+b; },0);
    var total=totalBase+totalOpt;
    var rarity=Object.keys(opts).length===3?"rainbow":total>=350?"gold":total>=200?"silver":"bronze";
    return {base:base, opts:opts, total:total, rarity:rarity};
  }

  function takePicture(){
    if(summonCount<=0){ document.getElementById('paywall-modal').classList.add('active'); return; }
    var video=document.getElementById('video');
    if(!video.srcObject){ alert('先にカメラを起動してください！'); return; }
    var canvas=document.getElementById('canvas');
    canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||480;
    canvas.getContext('2d').drawImage(video,0,0);
    var photo=canvas.toDataURL('image/jpeg',0.6);
    var now=new Date();
    var timeStr=(now.getMonth()+1)+'/'+now.getDate()+' '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    var chara = selectChara(now);
    var stats = rollStats();
    summonCount--;

    stopCamera();
    document.getElementById('btn-summon').textContent = 'カメラを起動';

    if(collected[chara.id]){ pendingNew=newData; showReveal(newData, true); }
    else{ collected[chara.id]=newData; showReveal(newData, false); saveToDB(newData); }
  }

    var keys=Object.keys(opts);

      var nv=nw.base[s], ov=old.base[s], diff=nv-ov;
      nTotal+=nv; oTotal+=ov;

      rows+='<tr><td>'+s+'</td><td>'+nv+'</td><td>'+ov+'</td><td class="'+cls+'">'+ds+'</td></tr>';

    Object.keys(allOpts).forEach(function(k){

      else if(nv!==undefined){ ds='NEW'; cls='diff-new'; }
      else{ ds='-'; cls='diff-none'; }
      rows+='<tr><td style="color:#ffc832">'+k+'</td><td style="color:'+(nv!==undefined?'#ffc832':'#555')+'">'+(nv!==undefined?nv:'-')+'</td><td style="color:'+(ov!==undefined?'#ffc832':'#555')+'">'+(ov!==undefined?ov:'-')+'</td><td class="'+cls+'">'+ds+'</td></tr>';

  function inputId(){ var newId=prompt('引き継ぎたいIDを入力してください：'); if(newId&&newId.trim()){ localStorage.setItem('zukan_user_id',newId.trim()); alert('IDを変更しました！ページをリロードします。'); location.reload(); } }
  function resetData(){
    if(confirm('データを全てリセットしますか？\n図鑑・お気に入りが消えます。')){
      sb.from('collected_characters').delete().eq('user_id', userId).then(function(){
        return sb.from('user_profiles').delete().eq('user_id', userId);
      }).then(function(){
        localStorage.removeItem('zukan_user_id');
        alert('リセットしました！');
        location.reload();
      });
    }
  }

  init();

const zoom = document.getElementById('photo-zoom');
const zoomImg = document.getElementById('photo-zoom-img');

document.getElementById('detail-photo').onclick = function(){
  if(!this.src) return;
  zoom.style.display = 'flex';
  zoomImg.src = this.src;
};

zoom.onclick = function(){
  zoom.style.display = 'none';
};

document.getElementById('detail-chara-visual').onclick = function(){
  const img = this.querySelector('img');
  if(!img) return;
  zoom.style.display = 'flex';
  zoomImg.src = img.src;
};
</script>
<div id="summon-flash" class="summon-flash"></div>
