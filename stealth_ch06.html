<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>気配｜ZERAPHIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d2c1c;--ink-soft:#735c3d;--line:#9a7540;--gold:#bc8d36;--tile:#fbf5e6;--tile-alt:#f3e9d2;--wall:#b9a27c;--sight:rgba(214,96,52,.28);--sight-edge:rgba(184,70,32,.75);--next:rgba(184,70,32,.55);--safe:#c69a3c}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;overflow:hidden!important;overscroll-behavior:none;touch-action:none}
body{color:var(--ink);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% 47%,#fffdf6 0%,#f3ead8 50%,#d5c4a4 100%)}
body:before{content:"";position:fixed;inset:7px;pointer-events:none;border:1px solid rgba(132,94,42,.36);box-shadow:inset 0 0 0 4px rgba(255,255,255,.42),inset 0 0 0 5px rgba(157,119,62,.20);z-index:0}
main{position:relative;z-index:1;width:100%;max-width:600px;height:100dvh;margin:0 auto;padding:calc(13px + env(safe-area-inset-top)) 11px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.chapter{margin:0;font-size:10px;letter-spacing:.24em;color:#866b43;text-shadow:0 1px #fff}
#exitBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));left:17px;min-height:32px;padding:5px 11px;z-index:3;font-size:11px}
h1{margin:8px 0 0;font-size:clamp(19px,3.4dvh,25px);font-weight:600;letter-spacing:.17em;color:#4d3520;text-shadow:0 1px 0 #fff}
h1:after{content:"◆  ◇  ◆";display:block;margin:4px auto 0;font-size:8px;letter-spacing:.65em;color:#b28a4d;text-align:center}
.guide{margin:5px 0 0;min-height:3em;max-width:30em;font-size:clamp(11px,1.8dvh,13px);line-height:1.55;color:#675036;text-align:center;transition:opacity .3s}
.stage{position:relative;flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;margin:6px 0}
svg{max-width:100%;max-height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 6px 13px rgba(81,53,22,.14))}
.tile{fill:var(--tile);stroke:rgba(154,117,64,.28);stroke-width:1}
.tile.alt{fill:var(--tile-alt)}
.wall{fill:var(--wall);stroke:#8d7550;stroke-width:1.2}
.wallmark{fill:none;stroke:rgba(255,255,255,.35);stroke-width:1}
.sight{fill:var(--sight);stroke:rgba(184,70,32,.5);stroke-width:1}
.next{fill:none;stroke:#a2401e;stroke-width:2.2;stroke-dasharray:5 3}
.move{fill:transparent;cursor:pointer}
.movedot{fill:none;stroke:var(--safe);stroke-width:2.2;pointer-events:none}
.movedot.danger{stroke:#a2401e;stroke-dasharray:3 3}
.movedot.hint{fill:rgba(198,154,60,.55)}
.catchsight{fill:rgba(190,60,30,.45);stroke:#a2401e;stroke-width:2}
.cross{stroke:#a2401e;stroke-width:4;stroke-linecap:round}
.goal{fill:none;stroke:var(--gold);stroke-width:2;opacity:.9}
.token-ring{fill:#fff9e9;stroke:#8d622e;stroke-width:2}
.token-ring.target{stroke:var(--gold);stroke-width:3}
.token-ring.aina{stroke:#6d7fb8;stroke-width:3;stroke-dasharray:3 2}
.token-label{font-size:10px;letter-spacing:-.04em;font-weight:600;fill:#4d3520;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.facing{fill:#8d622e}
.bubble{font-size:13px;font-weight:600;fill:#a2401e;text-anchor:middle;paint-order:stroke;stroke:#fffdf5;stroke-width:4px}
.rot{font-size:15px;font-weight:700;fill:#8d622e;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#fffdf5;stroke-width:3px}
.tok{transition:transform .22s ease}
.status{margin:0;padding:5px 18px;font-size:12px;letter-spacing:.1em;color:#6b5030;background:linear-gradient(90deg,transparent,#fff9eb 20%,#fff9eb 80%,transparent);border-top:1px solid rgba(162,119,51,.27);border-bottom:1px solid rgba(162,119,51,.27)}
.status b{color:#9c6c20;font-weight:600;font-size:15px}
.controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;justify-content:center}
button{appearance:none;font:inherit;font-size:12px;letter-spacing:.12em;color:#513a22;background:linear-gradient(180deg,#fffdf5,#e8d9bc);border:1px solid #a27b42;padding:9px 16px;min-height:40px;border-radius:0;box-shadow:inset 0 1px 0 #fff,0 2px 5px rgba(87,57,24,.17);cursor:pointer}
button:active{filter:brightness(.93)}button:disabled{opacity:.45}
.legend{margin:7px 0 0;font-size:10px;line-height:1.5;color:#786245;text-align:center}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin:0 3px 0 8px}
.legend .l1{background:var(--sight)}.legend .l2{border:2px dashed #a2401e}.legend .l4{border:2px dashed #a2401e;border-radius:50%}
.legend .l3{border:2px solid var(--safe);border-radius:50%}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(61,44,28,.28);z-index:5}
.over[hidden]{display:none}
.over-box{background:linear-gradient(180deg,#fffdf5,#efe3c8);border:1px solid #a27b42;box-shadow:inset 0 0 0 4px rgba(255,255,255,.5),0 8px 24px rgba(61,44,28,.3);padding:18px 22px 16px;text-align:center;min-width:220px}
.over-title{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:.2em;color:#a2401e}
.over-box p{margin:0 0 4px;font-size:13px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
svg.caught{animation:shake .25s 2}
@media(max-height:620px){h1{font-size:18px}.guide{font-size:10px;min-height:0}.legend{display:none}}
</style>
</head>
<body>
<main>
  <p class="chapter">ZERAPHIA　/　第六章・気配</p>
  <button id="exitBtn" type="button">戻る</button>
  <h1 id="title">背後</h1>
  <p class="guide" id="guide"></p>
  <div class="stage"><svg id="board" role="group" aria-label="隠密の盤面"></svg>
    <div class="over" id="over" hidden><div class="over-box"><p class="over-title">GAME OVER</p><p id="overText"></p>
      <div class="controls"><button type="button" id="retryBtn">もう一度</button><button type="button" id="overExitBtn">戻る</button></div></div></div></div>
  <p class="status" id="status"></p>
  <div class="controls">
    <button type="button" id="waitBtn">その場で待つ</button>
    <button type="button" id="resetBtn">最初から</button>
    <button type="button" id="hintBtn">ヒント（残り3）</button>
  </div>
  <p class="legend"><i class="l1"></i>今の視界<i class="l2"></i>一手後の視界（止まるとアウト）<i class="l3"></i>進める先<i class="l4"></i>見つかる<br>見つかったら、その回は最初からやり直し。ヒントは全部で3回まで。<br>↻ 一歩ごとに時計回り　↺ 反時計回り　（マークなし：動かない）</p>
</main>

<script>
/*LOGIC_START*/
// ---- 盤面データ ----
// '.' 床 / '#' 瓦礫(通れない・視線を遮る) / 'A' アイナの開始位置 / 英字 観察者(下の who 参照)
// dir: 最初の向き / rot: cw=1手ごとに時計回り90° ccw=反時計回り fix=動かない / range: 見える距離(既定3)
const CHARS = {
  aina:{name:'アイナ',id:17}, jig:{name:'ジグ',id:5}, aura:{name:'アウラ',id:3}, eri:{name:'エリ',id:1},
  mimoza:{name:'ミモザ',id:28}, leona:{name:'レオナクロス',short:'レオナ',id:39}, arno:{name:'アルノ',id:20},
  toifel:{name:'トイフェル',short:'トイフ',id:37}, veronica:{name:'ベロニカ',id:22}
};
const LEVELS = [
  { title:'一回目', intro:'ジグの隣まで近づいて、肩を叩こう。<br>一手ごとに、みんな↻の向きへ90°向きを変える。<br>向きを変えたあとの視界（点線）で止まるとアウト。',
    clear:'ジグ「うおっ！？」',
    map:[
      '.......',
      '...J...',
      '.......',
      '.#...#.',
      '.......',
      '..U....',
      '.......',
      '...A...'],
    who:{ J:{c:'jig',dir:'N',rot:'cw',target:true}, U:{c:'aura',dir:'W',rot:'cw'} } },
  { title:'二回目', intro:'ジグ「……今のはまぐれだ。アルノ、お前も見てろ。」<br>アルノの視線は、ほかの人より一マス遠くまで届く。',
    clear:'ジグ「…………分かった。もういい。」',
    map:[
      '...#...',
      '.R...J.',
      '.......',
      '..#.#..',
      'E......',
      '.....U.',
      '..#....',
      '...A...'],
    who:{ J:{c:'jig',dir:'N',rot:'cw',target:true}, R:{c:'arno',dir:'S',rot:'cw',range:4},
          E:{c:'eri',dir:'N',rot:'cw'}, U:{c:'aura',dir:'E',rot:'ccw'} } }
];
const DIRS = {N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};

function parseLevel(L){
  const H=L.map.length, W=L.map[0].length, walls=new Set(), obs=[]; let start=null;
  L.map.forEach((row,y)=>[...row].forEach((ch,x)=>{
    if(ch==='#') walls.add(x+','+y);
    else if(ch==='A') start=[x,y];
    else if(ch!=='.'){ const w=L.who[ch]; obs.push({x,y,c:w.c,dir:w.dir,rot:w.rot,range:w.range||3,target:!!w.target}); }
  }));
  return {W,H,walls,obs,start};
}
const ORDER='NESW';
function facingAt(o,t){ const k=o.rot==='cw'?1:o.rot==='ccw'?-1:0; return ORDER[(((ORDER.indexOf(o.dir)+k*t)%4)+4)%4]; }
function blocked(g,x,y){ return g.walls.has(x+','+y) || g.obs.some(o=>o.x===x&&o.y===y); }
function inside(g,x,y){ return x>=0&&y>=0&&x<g.W&&y<g.H; }
// 視線: 向いている方向に range マス。距離 f のとき横幅は ±floor(f/2)。瓦礫・人で遮られる。
function lineClear(g,ax,ay,bx,by){
  const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay))*4;
  for(let i=1;i<n;i++){
    const px=Math.round(ax+(bx-ax)*i/n), py=Math.round(ay+(by-ay)*i/n);
    if((px===ax&&py===ay)||(px===bx&&py===by)) continue;
    if(blocked(g,px,py)) return false;
  }
  return true;
}
function sightTiles(g,o,t){
  const [dx,dy]=DIRS[facingAt(o,t)], out=[];
  for(let f=1;f<=o.range;f++){
    const half=Math.floor(f/2);
    for(let s=-half;s<=half;s++){
      const x=o.x+dx*f+(dy!==0?s:0), y=o.y+dy*f+(dx!==0?s:0);
      if(!inside(g,x,y)||blocked(g,x,y)) continue;
      if(lineClear(g,o.x,o.y,x,y)) out.push([x,y]);
    }
  }
  return out;
}
function seenBy(g,x,y,t){
  for(const o of g.obs) if(sightTiles(g,o,t).some(([a,b])=>a===x&&b===y)) return o;
  return null;
}
function adjacentToTarget(g,x,y){
  const tg=g.obs.find(o=>o.target);
  return Math.abs(tg.x-x)+Math.abs(tg.y-y)===1;
}
// 1手: アイナが動く → 全員が向きを変える → 新しい視線(=画面の点線)に入っていたら見つかる。赤いマスは今の視線(参考)
function step(g,pos,t,dir){
  let [x,y]=pos;
  if(dir!=='wait'){ const [dx,dy]=DIRS[dir]; x+=dx; y+=dy; if(!inside(g,x,y)||blocked(g,x,y)) return {invalid:true}; }
  const who=seenBy(g,x,y,t+1); if(who) return {pos:[x,y],t:t+1,caught:who};
  return {pos:[x,y],t:t+1,win:adjacentToTarget(g,x,y)};
}
function period(g){ const gcd=(a,b)=>b?gcd(b,a%b):a; return 4; }
// 最短手順(BFS)
function solve(g,pos,t){
  const P=period(g), key=(p,tt)=>p[0]+','+p[1]+','+(tt%P);
  const q=[[pos,t,[]]], seen=new Set([key(pos,t)]);
  while(q.length){
    const [p,tt,path]=q.shift();
    for(const d of ['N','E','S','W','wait']){
      const r=step(g,p,tt,d); if(r.invalid||r.caught) continue;
      const np=path.concat(d);
      if(r.win) return np;
      const k=key(r.pos,r.t); if(seen.has(k)) continue; seen.add(k); q.push([r.pos,r.t,np]);
    }
  }
  return null;
}
/*LOGIC_END*/

(function(){
  'use strict';
  window.sendStealthEvent=function(type){
    try{
      if(type==='zeraphia-stealth-cleared'&&typeof window.zeraphiaStealthClear==='function'){window.zeraphiaStealthClear();return;}
      if(type==='zeraphia-stealth-exit'&&typeof window.zeraphiaStealthExit==='function'){window.zeraphiaStealthExit();return;}
      parent.postMessage({type},location.origin);
    }catch(e){console.error(e);}
  };
  const NS='http://www.w3.org/2000/svg', CELL=48, PAD=6;
  const svg=document.getElementById('board'), guide=document.getElementById('guide'), statusEl=document.getElementById('status');
  const titleEl=document.getElementById('title');
  const HINT_MAX=3;
  let li=0, g=null, pos=null, t=0, busy=false, retries=0, moves=0, hintsLeft=HINT_MAX, lastHintKey='';
  const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
  const cx=x=>PAD+x*CELL+CELL/2, cy=y=>PAD+y*CELL+CELL/2;

  function load(i){
    li=i; g=parseLevel(LEVELS[i]); pos=g.start.slice(); t=0; busy=false; moves=0; hideOver();
    svg.setAttribute('viewBox',`0 0 ${g.W*CELL+PAD*2} ${g.H*CELL+PAD*2}`);
    titleEl.textContent='背後　'+LEVELS[i].title;
    guide.innerHTML=LEVELS[i].intro;
    draw();
  }

  function token(parent,x,y,charKey,cls){
    const c=CHARS[charKey], gEl=el('g',{class:'tok',transform:`translate(${cx(x)} ${cy(y)})`},parent);
    const r=CELL*0.38, clipId='clip-'+charKey+'-'+Math.random().toString(36).slice(2,7);
    const cp=el('clipPath',{id:clipId},gEl); el('circle',{r:r-2},cp);
    el('circle',{class:'token-ring '+(cls||''),r},gEl);
    el('text',{class:'token-label'},gEl).textContent=c.short||c.name;
    const img=el('image',{href:`images/chara_${String(c.id).padStart(2,'0')}_panel.webp`,x:-r,y:-r,width:r*2,height:r*2,'clip-path':`url(#${clipId})`,preserveAspectRatio:'xMidYMin slice'},gEl);
    img.addEventListener('error',()=>img.remove());
    return gEl;
  }

  function draw(caughtBy,caughtWhen){
    svg.innerHTML='';
    const base=el('g',{},svg);
    for(let y=0;y<g.H;y++)for(let x=0;x<g.W;x++){
      const wall=g.walls.has(x+','+y);
      el('rect',{class:wall?'wall':'tile'+((x+y)%2?' alt':''),x:PAD+x*CELL,y:PAD+y*CELL,width:CELL,height:CELL},base);
      if(wall) el('path',{class:'wallmark',d:`M${PAD+x*CELL+8} ${PAD+y*CELL+CELL-10} L${PAD+x*CELL+CELL-8} ${PAD+y*CELL+12}`},base);
    }
    // 視線
    const sight=el('g',{},svg);
    g.obs.forEach(o=>{
      if(!caughtBy){
        sightTiles(g,o,t).forEach(([x,y])=>el('rect',{class:'sight',x:PAD+x*CELL+1,y:PAD+y*CELL+1,width:CELL-2,height:CELL-2},sight));
        sightTiles(g,o,t+1).forEach(([x,y])=>el('rect',{class:'next',x:PAD+x*CELL+4,y:PAD+y*CELL+4,width:CELL-8,height:CELL-8},sight));
      }
    });
    // ゴール(ジグの隣)
    const tg=g.obs.find(o=>o.target);
    [[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{
      const x=tg.x+dx,y=tg.y+dy; if(inside(g,x,y)&&!blocked(g,x,y)) el('circle',{class:'goal',cx:cx(x),cy:cy(y),r:6},sight);
    });
    // 進めるマス
    if(!busy) [['N',0,-1],['E',1,0],['S',0,1],['W',-1,0]].forEach(([d,dx,dy])=>{
      const x=pos[0]+dx,y=pos[1]+dy; if(!inside(g,x,y)||blocked(g,x,y)) return;
      const danger=!!seenBy(g,x,y,t+1);
      el('circle',{class:'movedot'+(danger?' danger':''),'data-dot':d,cx:cx(x),cy:cy(y),r:CELL*0.16},svg);
      const m=el('rect',{class:'move',x:PAD+x*CELL,y:PAD+y*CELL,width:CELL,height:CELL,'data-dir':d},svg);
      m.addEventListener('pointerdown',e=>{e.preventDefault();act(d);});
    });
    // 人
    g.obs.forEach(o=>{
      const tk=token(svg,o.x,o.y,o.c,o.target?'target':'');
      const [dx,dy]=DIRS[facingAt(o,t)], r=CELL*0.38+5;
      const ang=Math.atan2(dy,dx), px=Math.cos(ang)*r, py=Math.sin(ang)*r, s=6;
      el('path',{class:'facing',d:`M${px+Math.cos(ang)*s} ${py+Math.sin(ang)*s} L${px+Math.cos(ang+2.3)*s} ${py+Math.sin(ang+2.3)*s} L${px+Math.cos(ang-2.3)*s} ${py+Math.sin(ang-2.3)*s}Z`},tk);
      if(o.rot!=='fix') el('text',{class:'rot',x:CELL*0.3,y:CELL*0.36},tk).textContent=o.rot==='cw'?'↻':'↺';
      if(caughtBy===o) el('text',{class:'bubble',x:0,y:-CELL*0.52},tk).textContent='……ん？';
    });
    token(svg,pos[0],pos[1],'aina','aina');
    if(caughtBy){
      sightTiles(g,caughtBy,t).forEach(([x,y])=>el('rect',{class:'catchsight',x:PAD+x*CELL+2,y:PAD+y*CELL+2,width:CELL-4,height:CELL-4},sight));
      const X=cx(pos[0]),Y=cy(pos[1]),k=CELL*0.42;
      el('path',{class:'cross',d:`M${X-k} ${Y-k}L${X+k} ${Y+k}M${X+k} ${Y-k}L${X-k} ${Y+k}`},svg);
    }
    updateStatus();
  }

  const over=document.getElementById('over');
  function showOver(o){
    document.getElementById('overText').innerHTML=`${CHARS[o.c].name}に見つかった。`;
    over.hidden=false;
  }
  function hideOver(){ over.hidden=true; }
  document.getElementById('retryBtn').addEventListener('click',()=>load(li));
  document.getElementById('overExitBtn').addEventListener('click',()=>window.sendStealthEvent('zeraphia-stealth-exit'));

  function updateStatus(){
    statusEl.innerHTML=`${LEVELS[li].title}（${li+1} / ${LEVELS.length}）　手数 <b>${moves}</b>`;
    const hb=document.getElementById('hintBtn'); hb.textContent=`ヒント（残り${hintsLeft}）`; hb.disabled=busy||hintsLeft<=0;
    document.getElementById('waitBtn').disabled=busy; document.getElementById('resetBtn').disabled=busy;
  }

  function act(dir){
    if(busy) return;
    const r=step(g,pos,t,dir);
    if(r.invalid) return;
    pos=r.pos; t=r.t; moves++;
    if(r.caught){
      busy=true; retries++;
      draw(r.caught);
      svg.classList.remove('caught'); void svg.getBoundingClientRect(); svg.classList.add('caught');
      guide.innerHTML=`${CHARS[r.caught.c].name}「……ん？」`;
      setTimeout(()=>showOver(r.caught),900);
      return;
    }
    if(r.win){
      busy=true; draw();
      guide.innerHTML='トン。<br>'+LEVELS[li].clear;
      setTimeout(()=>{
        if(li+1<LEVELS.length) load(li+1);
        else { guide.innerHTML='トイフェル「……とまあ、こういうことさ。」'; statusEl.innerHTML=`クリア　やり直し <b>${retries}</b> 回`; setTimeout(()=>window.sendStealthEvent('zeraphia-stealth-cleared'),1600); }
      },1700);
      return;
    }
    draw();
  }

  function showHint(){
    if(busy||hintsLeft<=0) return;
    const path=solve(g,pos,t);
    if(!path){ guide.innerHTML='ここからは届かないみたい。「最初から」でやり直そう。'; return; }
    const hk=li+':'+pos+':'+t; if(lastHintKey!==hk){ hintsLeft--; lastHintKey=hk; updateStatus(); }
    const d=path[0];
    if(d==='wait'){ guide.innerHTML='ヒント：いまは「その場で待つ」のがよさそう。'; return; }
    const m=svg.querySelector(`.movedot[data-dot="${d}"]`);
    if(m){ m.classList.add('hint'); guide.innerHTML='ヒント：光ったマスへ。'; }
  }

  document.getElementById('waitBtn').addEventListener('click',()=>act('wait'));
  document.getElementById('resetBtn').addEventListener('click',()=>{ if(!busy) load(li); });
  document.getElementById('hintBtn').addEventListener('click',showHint);
  document.getElementById('exitBtn').addEventListener('click',()=>window.sendStealthEvent('zeraphia-stealth-exit'));
  window.addEventListener('keydown',e=>{
    const k={ArrowUp:'N',ArrowRight:'E',ArrowDown:'S',ArrowLeft:'W',' ':'wait'}[e.key];
    if(k){ e.preventDefault(); act(k); }
  });
  const q=new URLSearchParams(location.search).get('level');
  load(q?Math.max(0,Math.min(LEVELS.length-1,Number(q)-1)):0);
})();
</script>
</body>
