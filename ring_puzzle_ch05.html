<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>円環｜ZERAPHIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{--ink:#583c21;--ink-deep:#3e270e;--gold:#c69749;--pale:#fff6e7;--band:#f8e9ce;--shine:#ffe6a0}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;margin:0;overflow:hidden!important;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Serif JP','Yu Mincho',serif;color:var(--ink);background:#c5a574}
main{
  position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;
  width:100%;max-width:600px;height:100dvh;margin:0 auto;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 12px) 9px calc(env(safe-area-inset-bottom) + 19px);
  background:
    radial-gradient(ellipse 50% 42% at 50% 36%,rgba(255,254,245,.94),rgba(255,248,227,.42) 65%,transparent 100%),
    radial-gradient(ellipse 70% 80% at 48% 68%,rgba(255,248,223,.7),rgba(210,164,92,.2) 100%),
    linear-gradient(115deg,rgba(143,96,43,.22),transparent 12%,transparent 86%,rgba(136,82,29,.22)),
    linear-gradient(180deg,#f7ead4 0%,#f3dfba 43%,#e3bf83 100%);
}
main::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.52;pointer-events:none;background:repeating-linear-gradient(137deg,rgba(117,78,35,.037) 0px,rgba(117,78,35,.037) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(27deg,rgba(255,255,255,.09) 0px,rgba(255,255,255,.09) 1px,transparent 1px,transparent 13px)}
main::after{content:'';position:absolute;inset:4px;pointer-events:none;z-index:8;border:1px solid rgba(144,89,36,.5);outline:1px solid rgba(252,235,191,.84);outline-offset:-6px;box-shadow:inset 0 0 0 5px rgba(252,244,225,.27),inset 0 0 0 9px rgba(166,111,46,.14),0 0 25px rgba(139,89,37,.3)}
.ornament-frame{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.ornament-frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chapter{z-index:3;flex:0 0 auto;margin:0;padding:1px 6px;font:500 clamp(8px,2.1vw,11px)/1.45 'Cinzel','Noto Serif JP',serif;letter-spacing:.19em;color:#8d6a43;text-align:center;white-space:nowrap;text-shadow:0 1px rgba(255,255,255,.9)}
#puzzleExit{
  z-index:9;position:absolute;top:calc(env(safe-area-inset-top) + 15px);left:clamp(14px,4vw,24px);
  min-width:74px;min-height:35px;padding:5px 13px!important;display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid #ac7d36;border-radius:0;cursor:pointer;
  box-shadow:0 0 0 2px rgba(250,236,202,.92),0 0 0 3px #b8975d,inset 0 0 0 2px rgba(255,255,255,.92),0 3px 7px rgba(85,52,21,.3);
  background:linear-gradient(155deg,#fffaf0 0%,#f7e6c4 38%,#d2aa6d 100%);
  font:600 clamp(12px,3.3vw,15px)/1.3 'Noto Serif JP',serif;color:#62401d;text-shadow:0 1px rgba(255,255,255,.75)
}
#puzzleExit .back-arrow{font-family:serif;font-size:18px;line-height:1;transform:translateY(-1px)}
#puzzleExit:active{filter:brightness(.95)}
h1{z-index:3;flex:0 0 auto;margin:clamp(25px,4dvh,37px) 0 0;line-height:1.23;font-family:'Noto Serif JP',serif;font-size:clamp(26px,7.4vw,40px);font-weight:500;letter-spacing:.18em;color:#603d18;text-align:center;text-shadow:0 1px 0 #fff7e8,0 2px 6px rgba(148,93,41,.14)}
h1:after{content:'✧';display:block;font-size:14px;line-height:1;margin:clamp(5px,1.4dvh,10px) auto 0;color:#b88032;font-weight:400;letter-spacing:0}
.title-separator{position:relative;z-index:2;flex:0 0 auto;width:min(78%,300px);height:11px;margin-top:clamp(1px,.5dvh,5px)}
.title-separator::before{content:'';display:block;position:absolute;top:50%;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#d7b072 18%,#bd8745 45%,transparent 49%,transparent 51%,#bd8745 55%,#d7b072 82%,transparent)}
.title-separator::after{content:'✦';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#b17a2d;font:19px/1 serif;text-shadow:0 0 6px #fff0c6}
.guide{z-index:3;flex:0 0 auto;max-width:98%;min-height:2.9em;margin:clamp(7px,1.5dvh,13px) 0 0;text-align:center;font:400 clamp(10px,2.8vw,15px)/1.6 'Noto Serif JP',serif;letter-spacing:.03em;color:#5b3b21;text-shadow:0 1px 2px rgba(255,250,236,.85);transition:opacity .35s}
.stage{
  position:relative;z-index:2;flex:1 1 auto;min-height:0;
  width:min(99vw,520px,calc(100dvh - 262px));max-height:min(99vw,520px,calc(100dvh - 262px));aspect-ratio:1/1;
  display:flex;align-items:center;justify-content:center;margin:auto 0;
  filter:drop-shadow(0 10px 10px rgba(111,67,22,.2));
}
.stage::before{content:'';position:absolute;inset:2%;border-radius:50%;pointer-events:none;background:
  radial-gradient(circle at 46% 39%,rgba(255,251,236,.9),rgba(246,224,179,.48) 63%,rgba(187,129,59,.18) 88%,rgba(255,243,213,.58) 93%,transparent 97%);
  box-shadow:inset 0 0 0 1px rgba(138,94,47,.27),inset 0 0 12px rgba(175,119,43,.28),0 0 0 1px rgba(255,250,233,.8),0 0 22px rgba(255,244,203,.55)}
.stage::after{content:'';position:absolute;inset:4.4%;border:1px solid rgba(165,110,51,.42);outline:1px solid rgba(255,250,224,.7);outline-offset:-3px;border-radius:50%;pointer-events:none}
.ring-engraving{position:absolute!important;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;filter:drop-shadow(0 1px rgba(255,252,233,.75))}
#board{position:relative;z-index:2;width:100%;height:100%;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 2px 2px rgba(98,58,20,.13))}
.ring{transform-box:view-box;transform-origin:0 0;transition:transform .5s cubic-bezier(.32,.72,.2,1);cursor:pointer;outline:none}
.ring .band{fill:none;stroke:var(--band);filter:drop-shadow(0 1px 2px rgba(126,77,26,.15));transition:stroke .3s ease}
.ring:focus-visible .band{stroke:#f4dba9}
.ring .edge{fill:none;stroke:url(#ringMetal);stroke-width:2.2;opacity:.95;filter:drop-shadow(0 1px 1px rgba(117,65,12,.35))}
.ring .tick{stroke:#be9153;stroke-width:1.6}
.trace{fill:none;stroke:#66401f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;paint-order:stroke;filter:drop-shadow(0 1.8px 1.2px rgba(80,39,9,.42)) drop-shadow(0 -1px 0 rgba(255,246,221,.9));transition:stroke .45s ease,filter .45s ease}
.trace.lit{stroke:#c99732;filter:drop-shadow(0 0 5px #ffedac) drop-shadow(0 0 2px #fff9de)}
.ring.hint .band{animation:hint 1.6s ease-in-out}
@keyframes hint{50%{stroke:#ffe7af}}
.fixed{fill:none;stroke:#7f5425;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 1px 1px #ffedcc)}
.fixed.lit{stroke:#c48b30;filter:drop-shadow(0 0 5px #ffe5a3)}
.mark{fill:#ac7025;stroke:#fff1ce;stroke-width:1.5;filter:drop-shadow(0 0 4px #ffd889)}
.mark.lit{fill:#e9af44}
.disk{fill:url(#centerDisk);stroke:#b7873d;stroke-width:2.3;filter:drop-shadow(0 1px 3px rgba(108,57,13,.43));transition:fill .8s ease,stroke .8s ease}
.sigil{fill:none;stroke:#ac7b34;stroke-width:1.5;filter:drop-shadow(0 .5px rgba(255,247,228,.85))}
.compass-star{fill:url(#compassGold);stroke:#9a692d;stroke-width:.7;filter:drop-shadow(0 0 5px rgba(255,229,144,.92))}
.rays line{stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;opacity:0;stroke-dasharray:150;stroke-dashoffset:150}
#board.solved .disk{stroke:#e6b850}#board.solved .sigil{stroke:#d4a046}#board.solved .disk-wrap{animation:breathe 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:0 0}
#board.solved .rays line{animation:ray 1.6s ease-out forwards}#board.solved .ring{cursor:default}
@keyframes ray{0%{opacity:0;stroke-dashoffset:150}20%{opacity:.85}100%{opacity:.18;stroke-dashoffset:0}}
@keyframes breathe{50%{transform:scale(1.035)}}
.status{position:relative;z-index:3;flex:0 0 auto;min-height:46px;min-width:min(83%,300px);margin:0;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:6px;color:#5a3b1e;background:linear-gradient(180deg,rgba(255,252,238,.97),rgba(241,215,173,.94));border:1px solid #ae7d39;outline:1px solid rgba(255,247,220,.82);outline-offset:-4px;box-shadow:0 2px 7px rgba(93,53,22,.25),inset 0 0 0 1px rgba(255,249,228,.78);font:500 clamp(12px,3.2vw,16px)/1.45 'Noto Serif JP',serif;white-space:nowrap;text-shadow:0 1px rgba(255,251,229,.9)}
.status::before,.status::after{content:'✦';font:12px/1 serif;color:#c3944b;position:absolute;top:50%;transform:translateY(-50%)}.status::before{left:-15px}.status::after{right:-15px}
.status b{font:500 clamp(23px,7vw,30px)/1.1 'Cinzel',serif;color:#ab7023;margin-left:5px}
.status #total{font-size:17px;color:#51341b}
#statusNote{font-size:8px}
.controls{z-index:3;flex:0 0 auto;display:flex;justify-content:center;width:100%;margin:clamp(8px,2.4dvh,18px) 0 0}
#hintBtn{position:relative;min-width:min(73%,280px);height:clamp(43px,7.2dvh,56px);padding:8px 12px;display:flex;justify-content:center;align-items:center;gap:9px;color:#fff3d8;background:linear-gradient(130deg,#684526 0%,#392414 23%,#51351e 50%,#6e4725 79%,#3f2816 100%);border:1px solid #d6a75b;border-radius:0;outline:1px solid rgba(250,214,135,.88);outline-offset:-5px;box-shadow:0 0 0 2px rgba(255,248,220,.7),0 0 0 3px #9a713a,inset 0 0 0 3px rgba(119,80,42,.78),0 3px 11px rgba(77,44,16,.38);font:500 clamp(14px,3.6vw,18px)/1.2 'Noto Serif JP',serif;letter-spacing:.1em;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.75)}
#hintBtn::before{content:'✧';font:30px/1 'Cinzel',serif;color:#ffdfa0;text-shadow:0 0 6px #ffdb8c}
#hintBtn:active{filter:brightness(1.1)}#hintBtn:disabled{opacity:.6;cursor:default}
.modes{display:none!important}
.note{position:relative;z-index:3;flex:0 0 auto;margin:clamp(4px,1dvh,8px) 0 0;min-height:12px;color:#85643e;font:8px/1.3 'Noto Serif JP',serif;text-align:center;opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:360px){
 .chapter{font-size:8px;letter-spacing:.1em}#puzzleExit{min-width:60px;min-height:30px;padding:4px 8px!important;font-size:11px}
 h1{margin-top:23px;font-size:27px}.guide{font-size:10px}.stage{width:min(99vw,calc(100dvh - 242px));max-height:min(99vw,calc(100dvh - 242px))}
 .status{min-height:39px}#hintBtn{height:42px}.controls{margin-top:10px}
}
@media(max-height:620px){
 main{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:calc(env(safe-area-inset-bottom) + 11px)}
 h1{margin-top:22px;font-size:25px}h1:after{margin-top:2px}.guide{margin-top:5px;font-size:10px;line-height:1.4;min-height:2.8em}
 .stage{width:min(99vw,520px,calc(100dvh - 232px));max-height:min(99vw,520px,calc(100dvh - 232px))}
 .status{min-height:38px;padding:5px 10px}.status b{font-size:22px}
 .controls{margin-top:8px}#hintBtn{height:38px}
 .note{display:none}
}
@media(prefers-reduced-motion:reduce){.ring{transition-duration:.12s}#board.solved .disk-wrap{animation:none}#board.solved .rays line{animation-duration:.01s}}
</style>

<body>
<main>
  <div class="ornament-frame" aria-hidden="true">
    <svg viewBox="0 0 390 720" preserveAspectRatio="none" focusable="false">
      <defs><linearGradient id="borderGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4ce"/><stop offset=".28" stop-color="#be8638"/><stop offset=".55" stop-color="#fff4ce"/><stop offset=".88" stop-color="#ae742b"/><stop offset="1" stop-color="#fff6d9"/></linearGradient></defs>
      <rect x="12" y="10" width="366" height="700" rx="2" stroke="url(#borderGold)" stroke-width="1.8" fill="none" opacity=".8"/>
      <rect x="19" y="17" width="352" height="686" stroke="#fef3d6" fill="none" stroke-width="1" opacity=".8"/>
      <g fill="none" stroke="url(#borderGold)" stroke-linecap="round" stroke-width="1.05" opacity=".73">
        <path d="M20 150 Q16 72 110 17 M20 190 Q28 75 145 20 M370 150 Q374 72 280 17 M370 190 Q362 75 245 20"/>
        <path d="M20 570 Q16 646 110 703 M20 530 Q28 644 145 700 M370 570 Q374 646 280 703 M370 530 Q362 644 245 700"/>
        <path d="M28 27l11 7 11-7m-22 0l-7 11 7 11M362 27l-11 7-11-7m22 0l7 11-7 11"/>
        <path d="M28 693l11-7 11 7m-22 0l-7-11 7-11M362 693l-11-7-11 7m22 0l7-11-7-11"/>
        <path d="M195 9 L195 26 M181 15 L209 15 M195 694 L195 711 M181 705 L209 705"/>
      </g>
      <g fill="#d3a55d" stroke="#fff0c4" stroke-width=".7"><path d="M195 2l7 13-7 13-7-13z"/><path d="M195 692l7 13-7 13-7-13z"/>
        <path d="M26 175l4 10-4 10-4-10z M364 175l4 10-4 10-4-10z M26 535l4 10-4 10-4-10z M364 535l4 10-4 10-4-10z"/></g>
      <g fill="#c79b55" opacity=".7"><path d="M29 238l2 8 8 2-8 2-2 8-2-8-8-2 8-2z M360 238l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/>
        <path d="M42 605l2 9 9 2-9 2-2 9-2-9-9-2 9-2z M348 605l2 9 9 2-9 2-2 9-2-9-9-2 9-2z"/></g>
    </svg>
  </div>
  <p class="chapter">ZERAPHIA ✧　第五章・円環</p>
  <button id="puzzleExit" type="button" onclick="window.sendRingEvent('zeraphia-ring-exit')"><span class="back-arrow" aria-hidden="true">❮</span>戻る</button>
  <h1 id="puzzleTitle">ずれた輪</h1>
  <div class="title-separator" aria-hidden="true"></div>
  <p class="guide" id="guide">輪に触れると、その輪と、すぐ内側の輪が一緒に回る。<br>外側の円から内側の円まで、線を一本につなげよう。</p>
  <div class="stage" aria-label="円環パズル盤面">
    <svg class="ring-engraving" viewBox="-205 -205 410 410" focusable="false" aria-hidden="true">
      <defs><linearGradient id="gilded" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6d3"/><stop offset=".25" stop-color="#b27a2d"/><stop offset=".47" stop-color="#fff3ca"/><stop offset=".71" stop-color="#a87630"/><stop offset="1" stop-color="#f8daa0"/></linearGradient></defs>
      <g fill="none" stroke="url(#gilded)" opacity=".83">
        <circle r="199" stroke-width="1"/><circle r="195" stroke-width=".8"/><circle r="188" stroke-width="2.2"/>
        <circle r="184" stroke-width=".7"/><circle r="160" stroke-width=".65" stroke-dasharray="1 12"/>
        <circle r="120" stroke-width=".7"/><circle r="75" stroke-width=".65"/>
      </g>
      <g fill="#a87937" opacity=".7">
        <path d="M0-203l7 15-7 15-7-15z M203 0l-15 7-15-7 15-7z M0 203l-7-15 7-15 7 15z M-203 0l15-7 15 7-15 7z"/>
      </g>
      <g fill="none" stroke="#c59855" stroke-width="1" opacity=".7">
        <path d="M-137-137l-7-7m281 7l7-7m-281 281l-7 7m281-7l7 7"/>
      </g>
    </svg>
    <svg id="board" viewBox="-205 -205 410 410" role="group" aria-label="円盤と輪"></svg>
  </div>
  <p class="status" id="status">つながった線　<b id="count">0</b> / <span id="total">4</span><span id="statusNote"></span></p>
  <div class="controls"><button type="button" id="hintBtn">ヒント（残り2）</button></div>
  <div class="modes" style="display:none" role="group" aria-label="難易度">
    <button type="button" data-mode="easy" aria-pressed="false">三つの輪</button>
    <button type="button" data-mode="linked" aria-pressed="true">四つの輪・連動</button>

<script>
(function(){
  'use strict';
  window.sendRingEvent = function(type){
    try { if(type === 'zeraphia-ring-cleared' && typeof window.zeraphiaRingClear === 'function') { window.zeraphiaRingClear(); return; } if(type === 'zeraphia-ring-exit' && typeof window.zeraphiaRingExit === 'function') { window.zeraphiaRingExit(); return; } parent.postMessage({type:type}, location.origin); } catch(e) { console.error(e); }
  };
  const NS = 'http://www.w3.org/2000/svg';
  const STEPS = 8;              // 45°刻み
  const ENTRANCE = 0;           // 入口は真上
  const TRACES = 3;             // 1つの輪に刻まれた線の数（どれも外から内へ通り抜けている）
  const OUTER = 178, INNER = 58, GAP = 6, DISK_R = 46;

  const svg = document.getElementById('board');
  const guide = document.getElementById('guide');
  const countEl = document.getElementById('count');
  const totalEl = document.getElementById('total');
  const statusNote = document.getElementById('statusNote');
  const live = document.getElementById('live');
  const modeNote = document.getElementById('modeNote');

  let mode = new URLSearchParams(location.search).get('rings') === '3' ? 'easy' : 'linked';
  let rings = [];      // {outer, inner, mid, traces:[{o,n}], rot, deg, el, traceEls}
  let notch = 0;
  let solutions = [];  // 正解になる回転の組（複数ありうる）
  let solved = false;
  let evalTimer = 0, idleTimer = 0;
  let fixedEls = {};
  const HINT_MAX = 2;            // ヒントは2回まで
  let hintsLeft = HINT_MAX;
  const hintBtn = document.getElementById('hintBtn');
  const updateHintBtn = () => { hintBtn.textContent = `ヒント（残り${hintsLeft}）`; hintBtn.disabled = solved || hintsLeft <= 0; };

  const mod = (a, m) => ((a % m) + m) % m;
  const rand = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const ang = s => (s * 45 - 90) * Math.PI / 180;
  const pt = (r, s) => [+(r * Math.cos(ang(s))).toFixed(2), +(r * Math.sin(ang(s))).toFixed(2)];
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------- 盤面の生成 ----------
  // 1つの輪に、外の縁から内の縁まで通り抜ける線を3本刻む。
  // 線どうしは重ならず、間に必ず1マス空ける（つながって見えないように）。
  function makeRingTraces() {
    for (let attempt = 0; attempt < 300; attempt++) {
      const occ = new Array(STEPS).fill(false);
      const traces = [];
      for (const s of shuffle([...Array(STEPS).keys()])) {
        if (traces.length >= TRACES) break;
        const len = rand(3);                 // 0:まっすぐ / 1:45°曲がる / 2:90°曲がる
        const dir = rand(2) ? 1 : -1;
        const steps = [];
        for (let k = 0; k <= len; k++) steps.push(mod(s + dir * k, STEPS));
        const blocked = steps.some(x => occ[x] || occ[mod(x + 1, STEPS)] || occ[mod(x - 1, STEPS)]);
        if (blocked) continue;
        steps.forEach(x => { occ[x] = true; });
        traces.push({ o: s, n: steps[steps.length - 1] });
      }
      if (traces.length === TRACES) return traces;
    }
    return null;
  }

  // 入口から順に線をたどる。外の口が前の線の終点と合う線が、その輪の中に1本だけある。
  function follow(rs, rots, nt) {
    let cur = ENTRANCE, k = 0;
    const path = [];
    for (let i = 0; i < rs.length; i++) {
      const t = rs[i].traces.findIndex(tr => mod(tr.o + rots[i], STEPS) === cur);
      if (t < 0) break;
      path.push(t);
      cur = mod(rs[i].traces[t].n + rots[i], STEPS);
      k++;
    }
    return { k, path, end: cur, solved: k === rs.length && cur === nt };
  }

  function solutionsFor(rs, nt) {
    const out = [];
    const walk = (i, cur, rots) => {
      if (i === rs.length) { if (cur === nt) out.push(rots.slice()); return; }
      rs[i].traces.forEach(tr => {
        const rot = mod(cur - tr.o, STEPS);
        rots.push(rot);
        walk(i + 1, mod(tr.n + rot, STEPS), rots);
        rots.pop();
      });
    };
    walk(0, ENTRANCE, []);
    return out;
  }

  function generate(count) {
    const maxSolutions = count === 3 ? 1 : 2;
    let best = null;
    for (let tries = 0; tries < 400; tries++) {
      const rs = [];
      let ok = true;
      for (let i = 0; i < count; i++) {
        const t = makeRingTraces();
        if (!t) { ok = false; break; }
        rs.push({ traces: t });
      }
      if (!ok) continue;
      // 正解の道を1本決め、その終点を円盤の切れ込みにする（必ず解ける）
      let cur = ENTRANCE;
      rs.forEach(r => {
        const t = r.traces[rand(TRACES)];
        const rot = mod(cur - t.o, STEPS);
        cur = mod(t.n + rot, STEPS);
      });
      const nt = cur;
      const sols = solutionsFor(rs, nt);
      const cand = { rs, notch: nt, sols };
      if (sols.length <= maxSolutions) return cand;
      if (!best || sols.length < best.sols.length) best = cand;
    }
    return best;
  }

  // ---------- 描画 ----------
  function arcPath(r, from, to) {
    const delta = mod(to - from, STEPS);
    if (delta === 0) return '';
    const sweep = delta <= 4 ? 1 : 0;
    const [x, y] = pt(r, to);
    return `A ${r} ${r} 0 0 ${sweep} ${x} ${y}`;
  }
  function tracePath(ring, tr) {
    const [x1, y1] = pt(ring.outer, tr.o);
    const [x2, y2] = pt(ring.mid, tr.o);
    const [x3, y3] = pt(ring.inner, tr.n);
    return `M ${x1} ${y1} L ${x2} ${y2} ${arcPath(ring.mid, tr.o, tr.n)} L ${x3} ${y3}`;
  }

  function newPuzzle() {
    clearTimeout(evalTimer); clearTimeout(idleTimer);
    solved = false;
    svg.innerHTML = '';
    svg.classList.remove('solved');

    const count = mode === 'linked' ? 4 : 3;
    const width = (OUTER - INNER - GAP * (count - 1)) / count;
    const g = generate(count);
    notch = g.notch;
    solutions = g.sols;
    rings = g.rs.map((r, i) => {
      const outer = OUTER - i * (width + GAP);
      const inner = outer - width;
      return { outer, inner, mid: (outer + inner) / 2, traces: r.traces, rot: 0, deg: 0 };
    });

    // 初期配置：解けていない、正解とも一致しない回転から始める
    do {
      rings.forEach(r => { r.rot = rand(STEPS); });
    } while (follow(rings, rings.map(r => r.rot), notch).solved);
    rings.forEach(r => { r.deg = r.rot * 45; });

    hintsLeft = HINT_MAX; updateHintBtn();
    draw();
    totalEl.textContent = String(count + 1);
    guide.innerHTML = mode === 'linked'
      ? '輪に触れると、その輪と、すぐ内側の輪が一緒に回る。<br>外側の円から内側の円まで、線を一本につなげよう。'
      : '輪に触れると、その輪と、すぐ内側の輪が一緒に回る。<br>外側の円から内側の円まで、線を一本につなげよう。';
    guide.style.opacity = 1;
    evaluate(true);
    armIdleHint();
  }

  function draw() {
    const defs = el('defs', {}, svg);
    defs.innerHTML = '<linearGradient id="ringMetal" x1="0%" y1="0%" x2="50%" y2="100%"><stop stop-color="#fff8d6"/><stop offset="28%" stop-color="#a67a38"/><stop offset="60%" stop-color="#eed29b"/><stop offset="100%" stop-color="#99672e"/></linearGradient>'
      + '<radialGradient id="centerDisk" cx="41%" cy="36%" r="70%"><stop stop-color="#fffdf1"/><stop offset="60%" stop-color="#f8e7c3"/><stop offset="87%" stop-color="#d7b377"/><stop offset="100%" stop-color="#fff3d3"/></radialGradient>'
      + '<linearGradient id="compassGold" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#fff7bb"/><stop offset="40%" stop-color="#c48d31"/><stop offset="70%" stop-color="#ffeab0"/><stop offset="100%" stop-color="#996020"/></linearGradient>';
    const rays = el('g', { class: 'rays' }, svg);
    for (let s = 0; s < STEPS; s++) {
      const [x1, y1] = pt(DISK_R + 4, s + 0.5);
      const [x2, y2] = pt(DISK_R + 154, s + 0.5);
      const l = el('line', { x1, y1, x2, y2 }, rays);
      l.style.animationDelay = (s * 0.07) + 's';
    }

    rings.forEach((r, i) => {
      const g = el('g', {
        class: 'ring', tabindex: '0', role: 'button',
        'aria-label': `外側から${i + 1}番目の輪を回す`,
        'data-i': String(i)
      }, svg);
      el('circle', { class: 'band', r: r.mid, 'stroke-width': r.outer - r.inner }, g);
      el('circle', { class: 'edge', r: r.outer }, g);
      el('circle', { class: 'edge', r: r.inner }, g);
      for (let s = 0; s < STEPS; s++) {
        const [x1, y1] = pt(r.outer - 3, s);
        const [x2, y2] = pt(r.outer - 8, s);
        el('line', { class: 'tick', x1, y1, x2, y2 }, g);
      }
      r.traceEls = r.traces.map(tr => el('path', { class: 'trace', d: tracePath(r, tr) }, g));
      r.el = g;
      g.style.transform = `rotate(${r.deg}deg)`;
    });

    const [ex1, ey1] = pt(OUTER + 20, ENTRANCE);
    const [ex2, ey2] = pt(OUTER, ENTRANCE);
    fixedEls.entrance = el('line', { class: 'fixed', x1: ex1, y1: ey1, x2: ex2, y2: ey2 }, svg);
    const [mx, my] = pt(OUTER + 24, ENTRANCE);
    fixedEls.mark = el('rect', { class: 'mark', x: mx - 4, y: my - 4, width: 8, height: 8, transform: `rotate(45 ${mx} ${my})` }, svg);

    const wrap = el('g', { class: 'disk-wrap' }, svg);
    const [nx1, ny1] = pt(INNER, notch);
    const [nx2, ny2] = pt(DISK_R, notch);
    fixedEls.notch = el('line', { class: 'fixed', x1: nx1, y1: ny1, x2: nx2, y2: ny2 }, wrap);
    el('circle', { class: 'disk', r: DISK_R }, wrap);
    el('circle', { class: 'sigil', r: 24 }, wrap);
    // 紋様の線は円盤の縁まで届かせる（輪の8方向とそろえる）
    for (let s = 0; s < STEPS; s++) {
      const [x1, y1] = pt(DISK_R, s);
      const [x2, y2] = pt(DISK_R, s + 4);
      if (s < 4) el('line', { class: 'sigil', x1, y1, x2, y2, 'stroke-width': s % 2 ? .8 : 1.4 }, wrap);
    }
    el('circle', { class: 'sigil', r: 31, 'stroke-width': '.8' }, wrap);
    el('circle', { class: 'sigil', r: 6 }, wrap);
    // 八方位の星を中心に刻む。飾りは回転判定に影響しない。
    const compass = [];
    for(let i=0;i<16;i++){
      const rad = (i*22.5-90)*Math.PI/180;
      const rr = (i%4===0)?29:((i%2===0)?17:9);
      compass.push((i===0?'M':'L')+(Math.cos(rad)*rr).toFixed(2)+','+(Math.sin(rad)*rr).toFixed(2));
    }
    compass.push('Z');
    el('path',{class:'compass-star',d:compass.join(' ')},wrap);
    el('circle',{r:4,fill:'#fff8dc',stroke:'#ad772c','stroke-width':'.7'},wrap);
  }

  // ---------- 判定 ----------
  function evaluate(instant) {
    const res = follow(rings, rings.map(r => r.rot), notch);
    fixedEls.entrance.classList.add('lit');
    fixedEls.mark.classList.add('lit');
    rings.forEach((r, i) => {
      r.traceEls.forEach((p, t) => {
        p.style.transitionDelay = instant ? '0s' : (i * 0.09) + 's';
        p.classList.toggle('lit', i < res.k && res.path[i] === t);
      });
    });
    fixedEls.notch.style.transitionDelay = instant ? '0s' : (rings.length * 0.09) + 's';
    fixedEls.notch.classList.toggle('lit', res.solved);
    countEl.textContent = String(res.k + (res.solved ? 1 : 0));
    statusNote.textContent = (!res.solved && res.k === rings.length) ? '　切れ込みに届いていない' : '';
    if (res.solved && !solved) win();
  }

  function win() {
    solved = true;
    updateHintBtn();
    clearTimeout(idleTimer);
    setTimeout(() => {
      svg.classList.add('solved');
      guide.style.opacity = 0;
      setTimeout(() => {
        guide.innerHTML = '……つながった。<br>止まっていた紋様に、律動が戻っていく。';
        guide.style.opacity = 1;
      }, 400);
      live.textContent = '紋様がすべてつながりました。';
      setTimeout(() => window.sendRingEvent('zeraphia-ring-cleared'), 2200);
    }, rings.length * 90 + 450);
  }

  // ---------- 操作 ----------
  function rotate(i, dir) {
    if (solved || !rings[i]) return;
    const targets = rings[i + 1] ? [i, i + 1] : [i];
    targets.forEach(t => {
      const r = rings[t];
      r.rot = mod(r.rot + dir, STEPS);
      r.deg += 45 * dir;
      r.el.style.transform = `rotate(${r.deg}deg)`;
    });
    clearTimeout(evalTimer);
    evalTimer = setTimeout(() => evaluate(false), 480);
    armIdleHint();
  }

  function ringAt(clientX, clientY) {
    const p = svg.createSVGPoint();
    p.x = clientX; p.y = clientY;
    const m = svg.getScreenCTM();
    if (!m) return -1;
    const q = p.matrixTransform(m.inverse());
    const d = Math.hypot(q.x, q.y);
    return rings.findIndex((r, i) => d >= r.inner - GAP / 2 && d <= r.outer + GAP / 2 + (i === 0 ? 10 : 0));
  }

  svg.addEventListener('pointerdown', e => {
    const i = ringAt(e.clientX, e.clientY);
    if (i >= 0) { e.preventDefault(); rotate(i, 1); }
  });
  svg.addEventListener('keydown', e => {
    const g = e.target.closest && e.target.closest('.ring');
    if (!g) return;
    const i = Number(g.getAttribute('data-i'));
    if (e.key === 'ArrowLeft') { e.preventDefault(); rotate(i, -1); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rotate(i, 1); }
  });

  // ヒント：いまの配置から最も近い正解を選び、最初に回すべき輪を光らせる
  function tapsTo(sol) {
    const cur = rings.map(r => r.rot);
    const plan = [];
    for (let i = 0; i < cur.length; i++) {
      const t = mod(sol[i] - cur[i], STEPS);
      plan.push(t);
      if (i + 1 < cur.length) cur[i + 1] = mod(cur[i + 1] + t, STEPS);
    }
    return plan;
  }
  function showHint() {
    if (solved || !solutions.length || hintsLeft <= 0) return;
    let bestPlan = null;
    solutions.forEach(sol => {
      const plan = tapsTo(sol);
      const total = plan.reduce((a, b) => a + b, 0);
      if (!bestPlan || total < bestPlan.total) bestPlan = { plan, total };
    });
    const i = bestPlan.plan.findIndex(t => t > 0);
    if (i < 0) return;
    hintsLeft--; updateHintBtn();
    const g = rings[i].el;
    g.classList.remove('hint');
    void g.getBoundingClientRect();
    g.classList.add('hint');
    live.textContent = `外側から${i + 1}番目の輪を回してみよう。`;
  }
  // 放置時の自動ヒントは、回数制限を回避できてしまうため使わない
  function armIdleHint() {
    clearTimeout(idleTimer);
  }

  document.getElementById('hintBtn').addEventListener('click', showHint);
  
  document.querySelectorAll('.modes button').forEach(b => {
    b.addEventListener('click', () => {
      mode = b.dataset.mode;
      document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      modeNote.textContent = mode === 'linked'
        ? '連動：触れた輪の、すぐ内側の輪も一緒に回ります。'
        : 'キーボードでは、輪を選んで ← → で回せます。';
      newPuzzle();
    });
  });

  document.getElementById('puzzleTitle').textContent = mode === 'easy' ? 'ずれた輪' : 'もう一つの円環';
  guide.innerHTML = '輪に触れると、すぐ内側の輪も一緒に回る。<br>紋様の線を、外から円盤の中心までつなげよう。';
  newPuzzle();
})();
</script>
</body>
</html>
